# Linhas com # são comentários e podem ser removidas.
tags:
  - Case Management
summary: "Case Retrieve"
description: |
  Retrieve information about a case
operationId: Case-uniqueId-get
# Parâmetros da requisição
parameters:
  - $ref: ../../components/parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../components/parameters/cases_v2/Tenant.yaml
  - name: uniqueId
    in: path
    required: true
    description: "Case unique guid"
    schema:
      type: string
      format: uuid
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  # Preencha o path do schema de retorno '<response_dto_relative_path_and_name>'
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/cases_v2/CaseEntity.yaml"
  "400":
    description: "Bad Request"
  "500":
    description: "Internal Server Error"