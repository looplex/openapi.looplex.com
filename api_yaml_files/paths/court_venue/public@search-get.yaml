tags:
  - Court Venue
summary: "Court venue search"
description: |
  **search court venue by params**
operationId: search-get
parameters:
  - $ref: ../../components/parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../../api_yaml_files/components/parameters/court_venue/Tenant.yaml
  - $ref: ../../../api_yaml_files/components/parameters/court_venue/BearerToken.yaml
  - name: page
    in: query
    required: true
    description: "**The page**"
    schema:
      type: integer
  - name: page_size
    in: query
    required: true
    description: "**The page size**"
    schema:
      type: integer
  - name: filter
    in: query
    required: false
    description: |
      **Search term**<br />
      **This search uses [SCIM filter](https://datatracker.ietf.org/doc/html/rfc7644#section-3.4.2.2)<br />**
      **term (string)**: the term to search<br />
      **cnj (string)**: part of cnj number to search<br />
      **level (integer)**: filter items by level<br /> <br/>
      **Example of use: term co "Cível" or cnj co "8." and level eq 6**
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../components/schemas/common/ListResponse.yaml
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../components/schemas/court_venue/CourtVenue.yaml
  "500":
    description: "Internal Server Error"
 