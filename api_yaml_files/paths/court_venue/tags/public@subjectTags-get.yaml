tags:
  - Tags
summary: "/subjectTags"
description: |
  **Get all tag groups**
operationId: subjectTags-get
parameters:
  - $ref: ../../../components/parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../../../api_yaml_files/components/parameters/court_venue/BearerToken.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../../components/schemas/common/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../../components/schemas/court_venue/TagGroup.yaml
  "500":
    description: "Internal Server Error"