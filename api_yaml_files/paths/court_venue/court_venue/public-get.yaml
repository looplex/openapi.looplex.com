tags:
  - Court Venue
summary: "Query court venue by filters"
description: |
  **Query court venue by filters**
operationId: -get
parameters:
  - $ref: ../../../components/parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../../../api_yaml_files/components/parameters/court_venue/BearerToken.yaml
  - name: label
    in: query
    required: false
    example: "\"Estadual\""
    description: "**the node name to search**"
    schema:
      type: string
  - name: cnj
    in: query
    required: false
    example: "\"8.02\""
    description: "**cnj number to search**"
    schema:
      type: string
  - name: level
    in: query
    required: false
    example: 1
    description: "**filter items by level**"
    schema:
      type: integer
  - name: path
    in: query
    required: false
    example: "\"/2/\""
    description: "**the path to search**"
    schema:
      type: string
  - name: tags
    in: query
    required: false
    example: "00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000"
    description: "**tags' unique ids separated by comma**"
    schema:
      type: string
  - name: depth
    in: query
    required: false
    example: 2
    description: "**depth of descendant levels to include in the results.**"
    schema:
      type: integer
  - name: uuids
    in: query
    required: false
    example: "00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000"
    description: "**node's unique ids separated by comma**"
    schema:
      type: string
  - name: ids
    in: query
    required: false
    example: "−2147483648,−2147483648"
    description: "**node's ids separated by comma**"
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../../components/schemas/court_venue/Hierarchy.yaml
  "500":
    description: "Internal Server Error"