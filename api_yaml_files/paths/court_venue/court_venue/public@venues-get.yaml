tags:
  - Court Venue
summary: "/venues"
description: |
  **Query court venue by filter**
operationId: venues-get
parameters:
  - $ref: ../../../components/parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../../../api_yaml_files/components/parameters/court_venue/BearerToken.yaml
  - name: Filter
    in: query
    required: false
    description: |
      **The filter to search**
      
      **NOTE 1: Concatenate every parameter with 'and'**<br />
      **NOTE 2: Set the value of a filter using 'eq'**<br />
      **NOTE 3: It is not possible to filter by 'ancestors' and 'descendants' at the same time**

      **Example 1**:<br />
      level eq 2 and ancestors eq true and depth eq 1<br />
      
      **Example 2**:<br />
      level eq 1 and descendants eq true and depth eq 2<br />

      **Example 3**:<br />
      label eq "Estadual"<br />

      **Example 4**:<br />
      cnj eq 8.05

      **Example 5**:<br />
      path eq /4/2/

      **Valid options:**<br />
      - **label (string)**: the node name to search<br />
      - **cnj (string)**: cnj number to search<br />
      - **level (integer)**: filter items by level <br />
      - **path (string)**: the path to search <br />
      - **tags (string)**: tags' unique ids separated by comma <br />
      - **depth (integer)**: depth of descendant or ascendents levels to include in the results <br />
      - **uuids (string)**: node's unique ids separated by comma <br /> 
      - **ids (string)**: node's ids separated by comma
      - **ancestors (boolean)**: indicates the search for ancestors<br />
      - **descendants (boolean)**: indicates the search for descendants
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../../components/schemas/common/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../../components/schemas/court_venue/Venue.yaml
  "500":
    description: "Internal Server Error"