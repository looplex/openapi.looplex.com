tags:
  - Case Procedure
summary: "Procedure search"
description: |
  **search procedure by params**
operationId: procedures-search-get
parameters:
  - $ref: ../../../components/parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../../../api_yaml_files/components/parameters/court_venue/Tenant.yaml
  - $ref: ../../../../api_yaml_files/components/parameters/court_venue/BearerToken.yaml
  - name: startIndex
    in: query
    required: true
    description: "**The page**"
    schema:
      type: integer
  - name: count
    in: query
    required: true
    description: "**The page size**"
    schema:
      type: integer
  - name: filter
    in: query
    required: false
    description: |
      **Search term**<br />
      **This search uses [SCIM filter](https://datatracker.ietf.org/doc/html/rfc7644#section-3.4.2.2)<br />**
      **procedure (string)**: the term to search<br />
      **Example of use: (procedure co "Embargos")**
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../../components/schemas/common/ListResponse.yaml
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../../components/schemas/court_venue/Procedure.yaml
  "500":
    description: "Internal Server Error"
 