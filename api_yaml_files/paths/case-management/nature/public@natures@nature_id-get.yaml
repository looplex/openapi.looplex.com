tags:
  - Nature
summary: "/natures/:nature_id"
description: |
  **Retrieve a nature by id**
operationId: natures-nature_id-get
parameters:
  - $ref: ../../../components/parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../../../api_yaml_files/components/parameters/case-management/Tenant.yaml
  - $ref: ../../../../api_yaml_files/components/parameters/case-management/BearerToken.yaml
  # endpoint retrieve
  - name: nature_id
    in: path
    required: true
    description: |
      **The item's unique identifier**
    schema:
      type: string
      format: uuid
responses:
  # Utilizado quando apenas um item for retornado
  "200":
      description: "OK"
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/case-management/NatureEntity.yaml
 
  "500":
      description: "Internal Server Error"