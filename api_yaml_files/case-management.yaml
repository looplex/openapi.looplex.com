# https://redocly.com/docs/openapi-visual-reference/info/
openapi: 3.0.2
security: []
info:
  version: 1.0.0
  title: "Looplex Case Management"
  termsOfService: "https://docs.looplex.com.br/legal/termos-de-uso"
  contact:
    name: Developers Looplex
    email: developer@looplex.com.br
    url: "https://www.looplex.com.br"
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
  x-logo:
    url: "https://www.looplex.com.br/img/logo-default.png"
    href: "/"
  description: >
    Essa é a documentação da API Case Management
servers:
  - url: "https://apim.looplex.com/case-management/v1"
    description: "Case Management Server"
paths:
  
  # Authentication
  /token:
    post:
      $ref: .\paths\case-management\authentication\public@token-post.yaml
  
  # Case
  /cases/:case_id:
    get:
      $ref: .\paths\case-management\case\public@cases@uniqueId-get.yaml
  /cases:
    get:
      $ref: .\paths\case-management\case\public@cases-get.yaml
    post:
      $ref: .\paths\case-management\case\public@cases-post.yaml
  
  # Task
  /tasks/:task_id:
    get:
      $ref: .\paths\case-management\task\public@tasks@task_id-get.yaml
  /tasks:
    get:
      $ref: .\paths\case-management\task\public@tasks-get.yaml
    post:
      $ref: .\paths\case-management\task\public@tasks-post.yaml

  # Entry
  /entries/:entry_id:
    get:
      $ref: .\paths\case-management\entry\public@entries@entry_id-get.yaml
    # put:
    #   $ref: .\paths\case-management\entry\public@entries@entry_id-put.yaml
  /entries:
    get:
      $ref: .\paths\case-management\entry\public@entries-get.yaml
    post:
      $ref: .\paths\case-management\entry\public@entries-post.yaml

  # Timesheet
  /timesheets:
    get:
      $ref: .\paths\case-management\timesheet\public@timesheets-get.yaml
    post:
      $ref: .\paths\case-management\timesheet\public@timesheets-post.yaml
  /timesheets/:id:
    get:
      $ref: .\paths\case-management\timesheet\public@timesheets@id-get.yaml

components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: api_key
    auth_token:
      type: apiKey
      in: header
      name: auth_token
    basic_auth:
      type: http
      scheme: basic