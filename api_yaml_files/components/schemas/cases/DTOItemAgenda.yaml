title: DTOItemAgenda
type: object
properties:
  IDCaso: 
    type: integer    
  IDItemAgenda: 
    type: integer    
  IDItemAgendaPai: 
    type: integer
    description: "Se for uma subtarefa, esse valor é o identificador da tarefa pai, senão o valor será nulo"    
  IDFuncionarioCriador: 
    type: integer    
  IDForoUnificado:
    type: integer
  Tipo:     
    $ref: enums/TipoTarefa.yaml
  Titulo: 
    type: string    
  IDTitulocobranca: 
    type: integer    
  Data: 
    type: string    
  Lembrete: 
    type: string    
  DataLimite: 
    type: string    
  FuncionarioExecutor: 
    type: integer 
  FuncionarioResponsavel:
    type: integer     
  FuncionariosParticipantes: 
    example: [10, 20]
    type: array
    items: 
      type: integer
  Observacao: 
    type: string    
  DataRealizacao: 
    type: string
  IDStatusEncerramentoItemAgenda:
    type: integer
  ObservacaoRegistroRealizacao: 
    type: string    
  Situacao:      
    $ref: enums/SituacaoDoItemAgenda.yaml
  DataFormatada: 
    type: string
    example: "01/01/2022"
  DataLimiteFormatada: 
    type: string
    example: "01/01/2022"
  IDForo: 
    type: integer
  Local: 
    type: string    
  NomeFuncionarioExecutor: 
    type: string    
  DataCriacao: 
    type: string
    example: "2022-01-01T12:00:00"
  DataCriacaoFormatada: 
    type: string
    example: "01/01/2022"
  DataRealizacaoFormatada: 
    type: string    
  DataRegistroRealizacao: 
    type: string
  DataRegistroRealizacaoFormatada: 
    type: string
  SituacaoLembrete: 
    $ref: enums/SituacaoLembrete.yaml
  IsEditable: 
    type: boolean
  Concluido:
    type: boolean
    description: "Indica se o item está concluído"
  StatusEncerramentoItemAgenda:
    type: string    
  NomeClienteFormatado:
    type: string  
  AreaFormatada:
    type: string    
  TituloCasoFormatado:
    type: string
  NumeroDoCaso:
    type: integer
  TituloCaso:
    type: string
  NumeroExternoCaso:
    type: string
  Cliente:
    type: string
  Executor:
    type: string
  NumeroPasta:
    type: integer
  Assunto:
    type: string
  NumeroInterno:
    type: string
  Rito:
    type: string
  Vencido:
    type: string
  SituacaoString:
    type: string
  PoloAtivo:
    type: string
  PoloPassivo:
    type: string
  Classificacao:
    type: string
  ExecutionID:
    type: string
  CustomFields:
    description: "Os custom fields definidos para essa tarefa (item de agenda)"
    type: object
    example:
      integracao_1: {
        prop1: "Valor prop1",
        prop2: "valor prop2",
        prop_N: "Valor prop_N"
      }
      integracao_N: {
        prop1: "Valor prop1",
        prop_N: "Valor prop_N"
      }