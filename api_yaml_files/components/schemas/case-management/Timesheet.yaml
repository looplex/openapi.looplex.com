title: Timesheet
type: object
allOf:
  - $ref: ../scim/Resource.yaml
  - type: object
    properties:
      Classification:
        description: |
          **Classificação**<br />
        oneOf:
          - type: string
          - type: null
      Owner:
        description: |
          **Responsável**<br />
        oneOf:
          - $ref: SimpleEntity.yaml
          - type: null
      Date:
        description: |
          **Data**<br />
        oneOf:
          - type: string
            format: datetime
      Hours:
        description: |
          **Horas (quantidade de horas do lançamento)**<br />
          ISO 8601 duration format
        oneOf:
          - type: string
            format: duration
            example: "PT0H45M0S"
      TaskCode:
        description: |
          **Código da Tarefa**<br />
        oneOf:
          - type: string
          - type: null
      ActivityCode:
        description: |
          **Código da Atividade**<br />
        oneOf:
          - type: string
          - type: null
      Applicant:
        description: |
          **Solicitante**<br />
        oneOf:
          - $ref: SimpleEntity.yaml
          - type: null
      Description:
        description: |
          **Descrição**<br /> 
        oneOf:
          - type: string
          - type: null
      IsInvoiced:
        description: |
          **Faturado**<br />
        oneOf:
          - type: boolean
          - type: null
      CreatedAt:
        description: |
          **Criado em**<br />
        oneOf:
          - type: string
            format: datetime
          - type: null
      CreatedBy:
        description: |
          **Criado por**<br />
        oneOf:
          - $ref: SimpleEntity.yaml
          - type: null
      UpdatedAt:
        description: |
          **Atualizado em**<br />
        oneOf:
          - type: string
            format: datetime
          - type: null
      UpdatedBy:
        description: |
          **Atualizado por**<br />
        oneOf:
          - $ref: SimpleEntity.yaml
          - type: null
      Case:
        type: object
        description: |
          "**The case unique identifier**"
        properties:
          Id:
            type: string
            format: uuid