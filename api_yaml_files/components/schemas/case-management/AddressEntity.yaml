title: Endereço
type: object
properties:
  Country:
    description: "**ISO 3166-1 alpha2 value (2 caracteres)**<br />"
    type: string <nullable>
  PostalCode:
    type: string <nullable>
  StreetAddress:
    type: string <nullable>
  StreetAddressNumber:
    type: string <nullable>
  Pobox:
    type: string <nullable>
  Locality:
    type: string <nullable>
  Region:
    type: string <nullable>
  Neighborhood:
    type: string <nullable>
  Type:
    description: |
      **Tipo de endereço**<br />
      **Valores permitidos**<br />
      1: Residencial<br />
      2: Trabalho<br />
      3: Outro<br />
      4: Cobrança<br />
      5: Entrega
    type: string
  Primary:
    description: "**Se é o endereço principal**<br />"
    type: boolean