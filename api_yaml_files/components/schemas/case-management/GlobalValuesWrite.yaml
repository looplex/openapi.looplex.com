title: GlobalValues
type: object
properties: 
  AgainstPosition:
    description: |
      **Contra polo Ativo, Passivo, Terceiro...**<br />
      **Valores permitidos:**<br />
      Ativo<br />
      Passivo<br />
      Terceiro
    type: string
    example: "Ativo"
  Perspective:
    description: |
      **Perpectiva**<br />
      Indicação da perspectiva do valor, se é um valor a favor (ativo) ou contra (passivo) o cliente<br />
      **Valores permitidos**<br />
      Perda <br />
      Êxito
    type: string <nullable>
    example: "Êxito"
  RiskClassification:
    description: |
      **Risco**<br />
      Indicação do risco associado ao valor.<br />
      Se a probabilidade for maior que 50% devemos considerar como Provável.<br />
      Se a probabilidade de ocorrência estiver entre 10% e 50%, pode ser considerada como Possível. <br />
      E se essa probabilidade for inferior a 10%, é então Remota.<br />
      **Valores permitidos**<br />
      Provável<br />
      Possível<br />
      Remoto
    type: string
    example: "Possível"
  Currency:
    description: |
      **Moeda usada para os valores do caso**<br />
      **Valores permitidos:**<br />
      BRL<br />
      USD<br />
      EUR
    type: string
    example: "BRL"
  CaseDeclaredValue:
    description: |
      **Valor da causa**<br />
      Valor declarado na petição inicial, no contrato ou no documento que formaliza a obrigação
    type: number <nullable>
    example: 1
  CaseForeseenValue:
    description: |
      **Valor previsto**<br />
      Valor estimado para a resolução do caso, transação ou disputa
    type: number <nullable>
    example: 1
  CaseContingencyValue:
    description: |
      **Valor de contingência**<br />
      Valor de provisionamento vinculado a perspectiva e risco do caso. <br />
      Para os casos de êxito é uma estimativa do valor que poderá receber, e para os casos de perda é uma estimativa do valor que poderá pagar
    type: number <nullable>
    example: 1