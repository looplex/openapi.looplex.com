title: CustomFieldEntity
type: object
properties: 
  Id:
    description: |
      **Custom field unique identifier**<br />
    oneOf:
      - type: string
      - type: null
  Name:
    description: |
      **Custom field name**<br />
    oneOf:
      - type: string
      - type: null
  Type:
    description: |
      **Custom field type**<br />
      1: text<br />
      2: decimal<br />
      3: integer<br />
      4: date-time<br />
      5: text-multi-line<br />
      7: checkbox<br />
      6, 8, 9, 10, 11, 15, 16: dropdown<br />
      12, 13, 14: select<br />
      17: json<br />
    oneOf:
      - type: string
      - type: null
  Value:
    description: |
      **Value stored in the custom field**<br />
    oneOf:
      - type: string
      - type: null