title: CaseEntity
type: object
allOf:
  - $ref: '../scim/Resource.yaml'
  - type: object
    properties:
      Status:
        type: string
        example: "Ativo"
        description: |
          **Indicação do status do caso**<br />
          1: Ativo<br />
          2: Arquivado<br />
          3: Inativo<br />
          99: Excluído
      Type:
        type: string
        example: "Judicial Estadual"
        description: | 
          **Indicação do tipo de caso, define o tipo de justiça ou o tipo de transação jurídica**<br />
          1: Administrativo<br />
          2: Consultivo<br />
          3: Judicial Estadual<br />
          4: Judicial Federal<br />
          5: Judicial Trabalhista<br />
          7: Militar Estadual<br />
          8: Eleitoral<br />
          9: Militar União<br />
          10: Contrato<br />
          11: Due Diligence e Análise Documental<br />
          13: Societário<br />
          Cobrança Extrajudicial<br />
          Arbitragem
      SubType:
        type: string
        example: "Caso"
        description: |
          **Indicação do subtipo de caso, define se ele é um caso originário ou uma continuação como um recurso, incidente ou um subcaso**<br />
          1: Caso<br />
          2: Subcaso<br />
          3: Recurso<br />
          4: Incidente
      CaseHierarchy:
        oneOf:
          - type: array
            items:
              $ref: CaseHierarchy.yaml
          - type: null
      Identities:
        description: |
          **Identificação do caso, como número CNJ, NIRE, Número do contrato, ids de sistemas externos, etc**
        oneOf:
          - type: array
            items:
              $ref: IdentityEntity.yaml
          - type: null
      Title:
        description: "**Nome Jurídico do caso**"
        oneOf:
          - type: string
          - type: null
      Summary:
        description: "**Breve descrição sobre o caso**"
        oneOf:
          - type: string
          - type: null
      Locale:
        oneOf: 
          - type: string
          - type: null
        description: |
          **Utilizado em casos consultivos**<br />
          **Formato: País - Estado - Cidade**<br />
          Local da Jurisdição de um caso, ou cumprimento da obrigação.
      CourtVenue:
        oneOf:
          - type: string
          - type: null
        description: |
          **Utilizado para casos contenciosos, judiciais ou não**<br />
          Foro do caso, local onde o caso será julgado
      CaseProcedure:
        oneOf:
          - type: string
          - type: null
        description: "**Rito ou procedimento do caso**"
      Phase:
        oneOf:
          - type: string
          - type: null
        description: | 
          **Fase do caso**<br />
          Etapas que determinam os procedimentos que devem ser seguidos para a resolução do caso
      Nature:
        description: "**Indica os assuntos tratados no caso**"
        oneOf:
          - type: array
            items:
              type: string
          - type: null
      RetentionDate:
        oneOf:
          - type: string
            format: datetime
          - type: null
        description: |
          **Data de entrada** <br />
          Data em que a organização (escritório de advocacia ou departamento jurídico) foi oficialmente contratada pelo cliente para representar ou gerenciar o caso
      StartDate:
        oneOf:
          - type: string
            format: datetime
          - type: null
        description: |
          **Data de distribuição**<br />
          Data em que um caso foi distribuído para um tribunal em disputas ou data em que um contrato ou negócio jurídico foi assinado pelas partes
      FormationDate:
        oneOf:
          - type: string
            format: datetime
          - type: null
        description: |
          **Data de citação**<br />
          Data em que uma ação judicial ou negócio se torna ativo. Para disputas, é a data da citação. <br />
          Para contratos e atos societários, é a data em que o instrumento entra em vigor ou se torna exigível
      ResJudicataDate:
        oneOf:
          - type: string
            format: datetime
          - type: null
        description: |
          **Data de trânsito em julgado**<br />
          Data em que uma decisão se torna final e irrecorrível, tornando a sentença conclusiva e obrigatória. <br />
          A partir dessa data, o caso não pode ser reaberto ou contestado. Utilizado apenas para casos judiciais
      ForecastedEndDate:
        oneOf:
          - type: string
            format: datetime
          - type: null
        description: |
          **Data prevista para encerramento**<br />
          Data estimada para a conclusão de um caso, transação ou disputa. <br />
          Essa data é utilizada para fins de planejamento e pode ser ajustada conforme o andamento do caso
      CreatedAt:
        oneOf: 
          - type: string
            format: datetime
          - type: null
        description: |
          **Data de criação do caso**
      CreatedBy:
        description: "**Usuário que criou o caso**"
        oneOf:
          - $ref: SimpleEntity.yaml
          - type: null
      UpdatedAt:
        description: "**Atualizado em**"
        oneOf:
          - type: string
          - type: null
      UpdatedBy:
        description: "**Atualizado por**"
        oneOf:
          - $ref: SimpleEntity.yaml
          - type: null
      ClosedAt:
        description: "**Data de encerramento**"
        oneOf:
          - type: string
            format: datetime
          - type: null
      ClosedBy:
        description: "**Usuário que encerrou o caso**"
        oneOf:
          - $ref: SimpleEntity.yaml
          - type: null
      Group:
        description: |
          **Área** <br />
          Grupo ou área do escritório de advocacia ou departamento jurídico responsável pelo caso
        oneOf:
          - type: string
          - type: null
      Product:
        description: |
          **Produto**<br />
          Produto ou serviço do cliente que está relacionado ao caso
        oneOf:
          - type: array
            items:
              type: string
          - type: null
      CaseClient:
        description: |
          **Cliente**<br />
          Qualquer pessoa ou entidade que contrata ou retém uma equipe jurídica para gerenciar ou conduzir atividades em um caso em seu nome
        oneOf:
          - $ref: CaseClient.yaml
      LegalServiceAgreement:
        description: |
          **Contrato**<br />
          Contrato de prestação de serviços jurídicos que rege a relação entre o escritório de advocacia ou departamento jurídico e o cliente
        oneOf:
          - $ref: LegalServiceAgreement.yaml
      Owner:
        description: |
          **Responsável**<br />
          Advogado ou membro da equipe jurídica responsável pelo caso
        oneOf:
          - $ref: SimpleEntity.yaml
          - type: null
      Coowners:
        description: |
          **Corresponsáveis**<br />
          Advogados ou membros da equipe jurídica que compartilham a responsabilidade pelo caso
        oneOf:
          - type: array
            items:
              $ref: SimpleEntity.yaml
          - type: null
      ExternalServiceProvider:
        description: |
          **Escritório Responsável / Correspondente**<br />
          Prestador de serviços externo contratado para fornecer serviços jurídicos em um caso
        oneOf:
          - $ref: SimpleEntity.yaml
          - type: null
      Participants:
        desription: |
          **Quaisquer pessoas envolvidas em um caso, incluindo não apenas as partes, mas também outros interessados, como testemunhas, representantes legais, ou quaisquer outros que desempenhem um papel**
        oneOf:
          - $ref: ParticipantNaturalPerson.yaml
          - $ref: ParticipantLegalPerson.yaml
      GlobalValues: 
        description: |
          **Valores globais do caso, definidos por polo**
        oneOf:
          - type: array
            items:
              $ref: GlobalValues.yaml
          - type: null
      # Claims: # TODO
      # OppositionToClaims: # TODO
      # ProceduralObjections: # TODO
      Entry:
        description: |
          **Registro de andamentos do caso, criados por usuários ou automaticamente através de integrações**<br />
        oneOf:
          - type: array
            items:
              $ref: EntryEntity.yaml
          - type: null
      # Resolution: # TODO
      # PaymentOrDischarge: # TODO
      # Guaranties: # TODO
      Tasks:
        description: |
          **Tarefas a serem realizadas**<br />
        oneOf:
          - type: array
            items:
              $ref: TaskEntity.yaml
          - type: null  
      Timesheet:
        description: |
          **Registro de horas trabalhadas**<br /> 
        oneOf:
          - type: array
            items:
              $ref: Timesheet.yaml
          - type: null
      CustomFields:
        description: |
          **Campos personalizados criados pelo usuário**<br />
        oneOf:
          - type: array
            items:
              $ref: CustomFieldEntity.yaml
          - type: null
      Timeline:
        description: |
          **Linha do Tempo**<br />
          Log de eventos
        oneOf:
          - type: array
            items:
              $ref: TimelineEntity.yaml
          - type: null