title: Dados de andamento para inclusão
type: object
properties:
  CaseId:
    type: string
    format: uuid
    description: "**Case's unique identifier**"
  Date:
    type: string
    format: datetime
    example: "2025-05-21T15:00:00.000Z"
    description: "**Data do andamento**"
  Classification:
    type: string <nullable>
    description: "**Classificação do andamento**"
  Description:
    type: string
    example: "<Texto do andamento>"
    description: "**Texto do andamento**"
  IsInternal:
    type: boolean
    description: "**Indica se o andamento é de uso interno**"
  OfficialNotice:
    type: string <nullable>
    format: uuid
    description: "**Identificador da publicação que criou esse andamento (se houver)**"
  ClassificationType:
    type: string
    example: "MANUAL"
    description: |
      **Tipo de classificação do andamento**<br />
      **Valid values:**<br/>
      TIMESHEET<br/>
      COURT_NOTICES_AND_SERVICE<br/>
      DOCKET_ENTRY<br/>
      EMAIL<br/>
      AUTOMATIC<br/>
      MANUAL
  CustomFields:
    type: string
    example: {}
    description: "**Entry's custom fields**"