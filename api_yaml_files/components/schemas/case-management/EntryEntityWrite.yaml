title: Dados de andamento para inclusão
type: object
properties:
  CaseGuid:
    type: string
    format: uuid
    required: true
    description: "**Case unique id**"
  AuthorGuid:
    type: string
    format: uuid
    required: true
    description: "**Entry author unique id**"
  Date:
    type: string
    format: datetime
    required: true
    example: "2025-05-21T15:00:00.000Z"
    description: "**Data do andamento**"
  Classification:
    type: string <nullable>
    description: "**Classificação do andamento**"
  Description:
    type: string
    required: true
    example: "<Texto do andamento>"
    description: "**Texto do andamento**"
  IsInternal:
    type: boolean
    description: "**Indica se o andamento é de uso interno**"
  OfficialNotice:
    type: string <nullable>
    format: uuid
    description: "**Identificador da publicação que criou esse andamento (se houver)**"
  CreatedBy:
    $ref: SimpleEntityWrite.yaml
  ClassificationType:
    type: integer <nullable>
    example: 6
    description: |
      **Tipo de classificação do andamento**<br />
      null: Nenhum<br />
      1: Planilha de horas<br />
      2: Push de publicação<br />
      3: Push de andamento<br />
      4: Outlook<br />
      5: Automático<br />
      6: Manual