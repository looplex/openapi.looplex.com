title: Participante Pessoa Física
type: object
allOf:
  - $ref: ParticipantEntity.yaml
  - type: object
    properties:
      Dob:
        type: string <nullable>
        format: datetime
        description: "**Data de Nascimento**<br />"
      Gender:
        type: string <nullable>
        description: |
          Feminino<br />
          Masculino
      Nationality:
        description: "**Nacionalidade**<br />"
        type: string <nullable>
      MaritalStatus:
        type: string <nullable>
        description: |
          **Estado civil**<br />
          Solteiro<br />
          Casado<br />
          Viúvo<br />
          Separado<br />
          Divorciado
      Occupation:
        type: string <nullable>
        description: "**Profissão**"
      Role:
        type: string <nullable>
        description: |
          **Papel do participante no processo, ex: Autor, Réu, Testemunha, Juiz, Perito**<br />
          Os papéis são definidos de acordo com o tipo de caso e o rito do caso.<br />
          AUTOR<br />
          REU<br />
          ADVOGADO<br />
          PERITO<br />
          JUIZ<br />
          TESTEMUNHA