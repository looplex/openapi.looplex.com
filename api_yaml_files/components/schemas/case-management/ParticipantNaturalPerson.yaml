title: ParticipantNaturalPerson
type: object
allOf:
  - $ref: Participant.yaml
  - type: object
    properties:
      Dob:
        description: |
          **Data de Nascimento**<br />
        oneOf:
          - type: string
            format: datetime
          - type: null
      Gender:
        description: |
          1: Feminino<br />
          2: Masculino
        oneOf:
          - type: string
          - type: null
      Nationality:
        description: |
          **Nacionalidade**<br />
        oneOf:
          - type: string
          - type: null
      MaritalStatus:
        description: |
          **Estado civil**<br />
          1: Solteiro<br />
          2: Casado<br />
          3: Viúvo<br />
          4: Separado<br />
          5: Divorciado
        oneOf:
          - type: string
          - type: null
      Occupation:
        description: "**Profissão**"
        oneOf:
          - type: string
          - type: null
      Role:
        description: |
          **Papel do participante no processo, ex: Autor, Réu, Testemunha, Juiz, Perito**<br />
          Os papéis são definidos de acordo com o tipo de caso e o rito do caso.<br />
          AUTOR<br />
          REU<br />
          ADVOGADO<br />
          PERITO<br />
          JUIZ<br />
          TESTEMUNHA
        oneOf:
          - type: string
          - type: null