title: TaskContent
type: object
properties: 
  Type:
    type: string <nullable>
    description: |
      **Tipo**<br />
      **Valores permitidos:**<br />
      Audiência<br />
      Compromisso<br />
      Diligência<br />
      Prazo<br />
      **Definições:**<br />
      **Court hearing (Audiência):** A session in which a case is heard in court. <br />
      **Meeting (Compromisso):** An assembly of people for a particular purpose, especially for formal discussion<br />
      **Proceeding (Diligência):** Specific measure or action taken during a case (litigation, transactional or otherwise) to gather information, evidence, or ensure compliance with procedural requirements. <br />
      **Deadline (Prazo):** A date or time by which you have to do or complete something. <br />
  Title:
    description: "**Titulo**"
    type: string <nullable>
  Description:
    description: "**Descrição**"
    type: string <nullable>
  StartDate:
    description: "**Data de Início**"
    type: string <nullable>
    format: datetime
  DueDate:
    description: "**Data de Vencimento**"
    type: string <nullable>
    format: datetime
  CreatedBy:
    description: "**Criado por**"
    oneOf:
      - $ref: SimpleEntity.yaml
      - type: null
  CreatedAt:
    description: "**Criado em**"
    type: string <nullable>
    format: datetime
  UpdatedAt:
    description: "**Atualizado em**"
    type: string <nullable>
    format: datetime
  UpdatedBy:
    description: "**Atualizado por**"
    oneOf:
      - $ref: SimpleEntity.yaml
      - type: null
  CompletedAt:
    description: |
      **Concluído em**<br />
    type: string <nullable>
    format: datetime
  CompletedBy:
    description: "**Concluído por**"
    oneOf:
      - $ref: SimpleEntity.yaml
      - type: null
  Locale:
    description: "**Local**"
    type: string <nullable>
  TaskCode:
    description: "**Código da Tarefa**"
    type: string <nullable>
  ActivityCode:
    description: "**Código da Atividade**"
    type: string <nullable>
  Owner:
    description: "**Responsável**"
    $ref: SimpleEntity.yaml
  OtherParticipants:
    description: "**Outros Participantes**"
    type: array
    items:
      $ref: SimpleEntity.yaml
  Status:
    type: string <nullable>
    description: |
      **Status**<br />
      **Valores permitidos:**<br />
      4: Cancelada<br />
      5: Atribuída<br />
      6: Criada<br />
      7: Concluída<br />
      8: Reagendada<br />
      9: Suspensa
  Priority:
    type: string <nullable>
    description: |
      **Prioridade**<br />
      **Valores permitidos:**<br />
      1: Baixa<br />
      2: Média<br />
      3: Alta
  ConclusionNotes:
    type: string <nullable>
    description: "**Notas de Conclusão**"