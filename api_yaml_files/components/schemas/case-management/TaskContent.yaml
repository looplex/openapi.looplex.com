title: TaskContent
type: object
properties:
  ParentTaskId:
    type: string <nullable>
    format: uuid
    description: "**Unique identifier of parent task**"
  Type:
    type: string
    example: "COURT_HEARING"
    description: |
      **Tipo**<br />
      **Valores permitidos:**<br />
      COURT_HEARING<br />
      MEETING<br />
      FIELD_TASK<br />
      DEADLINE<br />

      **Definições:**<br />
      **COURT_HEARING (Audiência):** A session in which a case is heard in court. <br />
      **MEETING (Compromisso):** An assembly of people for a particular purpose, especially for formal discussion<br />
      **FIELD_TASK (Diligência):** Specific measure or action taken during a case (litigation, transactional or otherwise) to gather information, evidence, or ensure compliance with procedural requirements. <br />
      **DEADLINE (Prazo):** A date or time by which you have to do or complete something. <br />
  Title:
    description: "**Titulo**"
    type: string <nullable>
  Description:
    description: "**Descrição**"
    type: string <nullable>
  StartDate:
    description: "**Data de Início**"
    type: string <nullable>
    format: datetime
  DueDate:
    description: "**Data de Vencimento**"
    type: string <nullable>
    format: datetime
  CreatedBy:
    description: "**Criado por**"
    $ref: SimpleEntity.yaml
  CreatedAt:
    description: "**Criado em**"
    type: string <nullable>
    format: datetime
  UpdatedAt:
    description: "**Atualizado em**"
    type: string <nullable>
    format: datetime
  UpdatedBy:
    description: "**Atualizado por**"
    $ref: SimpleEntity.yaml
  CompletedAt:
    description: |
      **Concluído em**<br />
    type: string <nullable>
    format: datetime
  CompletedBy:
    description: "**Concluído por**"
    $ref: SimpleEntity.yaml
  Locale:
    description: "**Local**"
    type: string <nullable>
  TaskCode:
    description: "**Código da Tarefa**"
    type: string <nullable>
  ActivityCode:
    description: "**Código da Atividade**"
    type: string <nullable>
  Owner:
    description: "**Responsável**"
    $ref: SimpleEntity.yaml
  OtherParticipants:
    description: "**Outros Participantes**"
    type: array
    items:
      $ref: SimpleEntity.yaml
  Status:
    type: string
    example: "CREATED"
    description: |
      **Status**<br />
      CANCELED<br />
      CLAIMED<br />
      CREATED<br />
      COMPLETED<br />
      RESCHEDULED<br />
      SUSPENDED<br />

      **Definições:**<br />
      **CANCELED (Cancelada):** Finalizada sem atuação, a tarefa não foi realizada ou não é mais necessária<br />
      **CLAIMED (Atribuída):** Tarefa aberta e já tem um responsável (executor)<br />
      **CREATED (Criada):** Tarefa aberta mas sem um responsável (executor) definido<br />
      **COMPLETED (Concluída):** Tarefa realizada<br />
      **RESCHEDULED (Reagendada):** Tarefa com a data limite ajustada para outra data<br />
      **SUSPENDED (Suspensa):** Tarefa em espera, pode ser reaberta para uma conclusão futura
  Priority:
    type: string <nullable>
    example: "LOW"
    description: |
      **Prioridade**<br />
      **Valores permitidos:**<br />
      LOW<br />
      MEDIUM<br />
      HIGH<br />

      **Definições:**<br />
      **LOW (Baixa)**<br />
      **MEDIUM (Média)**<br />
      **HIGH (Alta)**
  ConclusionNotes:
    type: string <nullable>
    description: "**Notas de Conclusão**"
  Case:
    description: "Caso de uma tarefa"
    $ref: TaskCase.yaml