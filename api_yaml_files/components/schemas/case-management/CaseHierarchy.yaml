title: CaseHierarchy
description: Hierarquia do caso, mostra todos os casos relacionados a este, seus antecessores e sucessores
type: object
properties:
  Id:
    type: string
    format: uuid
    description: "**Case unique identifier**"
  Status:
    type: string
    example: "Ativo"
    description: |
      **Indicação do status do caso**<br />
      Ativo<br />
      Inativo<br />
      Arquivado<br />
      Excluído
  Type:
    type: string
    example: Judicial Estadual
    description: | 
      **Indicação do tipo de caso, define o tipo de justiça ou o tipo de transação jurídica**<br />
      Judicial Estadual<br />
      Judicial Federal<br />
      Judicial Trabalhista<br />
      Militar Estadual<br />
      Militar União<br />
      Eleitoral<br />
      Consultivo<br />
      Contrato<br />
      Societário<br />
      Cobrança Extrajudicial<br />
      Due Diligence e Análise Documental<br />
      Administrativo<br />
      Arbitragem
  SubType:
    type: string
    example: Caso
    description: |
      **Indicação do subtipo de caso, define se ele é um caso originário ou uma continuação como um recurso, incidente ou um subcaso**<br />
      Caso<br />
      Subcaso<br />
      Recurso<br />
      Incidente
  Title:
    type: string
    description: "**Nome Jurídico do caso**"
  Locale:
    type: string
    description: |
      **Utilizado em casos consultivos**<br />
      Formato: País - Estado - Cidade<br />
      Local da Jurisdição de um caso, ou cumprimento da obrigação. Utilizado para casos consultivos
  CourtVenue:
    type: string
    description: |
      **Utilizado para casos contenciosos, judiciais ou não**<br />
      Foro do caso, local onde o caso será julgado
  CaseProcedure:
    type: string
    description: "**Rito ou procedimento do caso**"
  Phase:
    type: string
    description: | 
      **Fase do caso**<br />
      Etapas que determinam os procedimentos que devem ser seguidos para a resolução do caso
  Identities:
    description: "**Case identities**"
    type: array
    items:
      $ref: IdentityEntity.yaml
  Descendants:
    description: "**Case hierarchy**"
    type: array
    items:
      $ref: CaseHierarchy.yaml