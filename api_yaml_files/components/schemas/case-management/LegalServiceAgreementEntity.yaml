title: "Legal service agreement"
type: object
allOf:
  - $ref: ../scim/Resource.yaml
properties:
  ClientId:
    type: string
    format: uuid
    description: "**Client's unique identifier**"
  Name:
    type: string
    description: "Legal service agreement's title"
  Summary:
    type: string
    description: "Legal service agreement's summary"
  CreatedAt:
    type: string
    format: datetime
    description: "Legal service agreement's created date"
  StartDate:
    type: string
    format: datetime
    description: "Legal service agreement's start date"
  ForecastedEndDate:
    type: string
    format: datetime
    description: "Legal service agreement's forecasted end date"
  DueDate:
    type: string
    format: datetime
    description: "Legal service agreement's due date"
  IsSameReviewerAttorneyFeesAndExpenses:
    type: boolean
  IsSamePayerAttorneyFeesAndExpenses:
    type: boolean
  BillingCompanyId:
    type: string
    format: uuid
  OwnerId:
    type: string
    format: uuid
  Number:
    type: integer
  KilometersReimbursement:
    type: integer
    description: |
      **Definições:**<br />
      ESCRITORIO = 1<br />
      CONTRATO = 2
  ExpenseRuleLocal:
    type: string
    description: |
      **Definições:**<br />
      REGRAESCRITORIO = 1<br/>
      REGRAEMPRESA = 2<br/>
      REGRACLIENTE = 3<br/>
      REGRACONTRATO = 4<br/>
      REGRAPROCESSO = 5<br/>
      REGRAVAZIA = 6
  Status:
    type: integer
    description: |
      **Definições:**<br/>
      ATIVO = 1<br/>
      ENCERRADO = 3