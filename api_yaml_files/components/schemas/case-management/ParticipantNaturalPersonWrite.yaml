title: Participante Pessoa Física
type: object
allOf:
  - $ref: ParticipantWrite.yaml
  - type: object
    properties:
      Dob:
        description: "**Data de Nascimento**"
        type: string <nullable>
        format: datetime
      Gender:
        description: |
          Feminino<br />
          Masculino
        type: string <nullable>
      Nationality:
        description: |
          **Nacionalidade**<br />
        type: string <nullable>
      MaritalStatus:
        description: |
          **Estado civil**<br />
          Solteiro<br />
          Casado<br />
          Viúvo<br />
          Separado<br />
          Divorciado
        type: string <nullable>
      Occupation:
        description: "**Profissão**"
        type: string <nullable>
      Role:
        description: |
          **Papel do participante no processo, ex: Autor, Réu, Testemunha, Juiz, Perito**<br />
          Os papéis são definidos de acordo com o tipo de caso e o rito do caso.<br />
          AUTOR<br />
          REU<br />
          ADVOGADO<br />
          PERITO<br />
          JUIZ<br />
          TESTEMUNHA
        type: string <nullable>