title: Participant
type: object
properties: 
  Id:
    description: |
      **Partcipant id**<br />
    type: string
    format: uuid
  Name:
    description: |
      **Participant name**<br />
    oneOf:
      - type: string
      - type: null
  Nickname:
    description: |
      **Apelido**<br />
    oneOf:
      - type: string
      - type: null
  IsMainParty:
    description: |
      **Indica se é a parte principal**<br />
    type: bool
  Represents:
    description: |
      **UUID do participante que está sendo representado**<br />
    oneOf:
      - type: array
        items:
          type: string
      - type: null
  Nature:
    description: |
      **Natureza**<br />
      1: Pessoa Física<br />
      2: Pessoa Jurídica
    type: string
  Position:
    description: |
      **Posição do participante**<br />
      1: Ativo<br />
      2: Passivo<br />
      3: Terceiro<br />
      4: Nenhum<br />
      5: Outro envolvido
    type: string
  Addresses:
    description: |
      **Endereços**<br />
    oneOf:
      - type: array
        items:
          $ref: AddressEntity.yaml
      - type: null
  Emails:
    description: |
      **Emails**<br />
    oneOf:
      - type: array
        items:
          $ref: EmailEntity.yaml
      - type: null
  Identities:
    description: |
      **CNPJ, Inscrição estadual, Inscrição municipal, CPF, RG, etc.**<br />
    oneOf:
      - type: array
        items:
          $ref: IdentityEntity.yaml
      - type: null
  PhoneNumbers:
    description: |
      **Telefones**<br />
    oneOf:
      - type: array
        items:
          $ref: PhoneNumberEntity.yaml
      - type: null