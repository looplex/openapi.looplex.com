title: "Legal service agreement to create"
type: object
properties:
  ClientId:
    type: string
    format: uuid
    description: "**Client's unique identifier**"
  Name:
    type: string
    description: "**Legal service agreement's title**"
    example: "Example name"
  Summary:
    type: string
    description: "**Legal service agreement's summary**"
    example: "Example summary"
  StartDate:
    type: string
    format: datetime
    description: "**Legal service agreement's start date**"
    example: "2025-01-01T12:00:00.000Z"
  ForecastedEndDate:
    type: string
    format: datetime
    description: "**Legal service agreement's forecasted end date**"
    example: "2025-01-25T12:00:00.000Z"
  DueDate:
    type: string
    format: uuid
    description: "**Legal service agreement's due date**"
    example: "2025-01-30T12:00:00.000Z"
  IsSameReviewerAttorneyFeesAndExpenses:
    type: boolean
  IsSamePayerAttorneyFeesAndExpenses:
    type: boolean
  KilometersReimbursement:
    type: integer
    example: 1
    description: |
      **Valores permitidos:**<br/>
      1<br />
      2

      **Definições:**<br />
      Escritorio = 1<br />
      Contrato = 2
  ExpenseRuleLocal:
    type: integer
    example: 1
    description: |
      **Valores permitidos:**<br/>
      1<br/>
      2<br/>
      3<br/>
      4<br/>
      5<br/>
      6

      **Definições:**<br />
      RegraEscritorio = 1<br/>
      RegraEmpresa = 2<br/>
      RegraCliente = 3<br/>
      RegraContrato = 4<br/>
      RegraProcesso = 5<br/>
      RegraVazia = 6
  BillingCompanyId:
    type: string
    format: uuid
  OwnerId:
    type: string
    format: uuid
  BillingRule:
    type: integer
    example: 1
    description: |
      **Valores permitidos:**<br/>
      1<br/>
      2<br/>
      3

      **Definições:**<br/>
      Cliente = 1<br/>
      Contrato = 2<br/>
      Processo = 3
  BillingRuleExpense:
    type: integer
    example: 1
    description: |
      **Valores permitidos:**<br/>
      1<br/>
      2<br/>
      3<br/>
      
      **Definições:**<br/>
      Cliente = 1<br/>
      Contrato = 2<br/>
      Processo = 3
  AllocationMethod:
    type: integer
    example: 1
    description: |
      **Valores permitidos:**<br />
      1<br/>
      2<br/>
      3<br/>

      ***Definições:**<br/>
      Fixo = 1<br />
      OrigemDoCaso = 2<br />
      AreaDoProfissional = 3
  Status:
    type: integer
    example: 1
    description: |
      **Valores permitidos:**<br/>
      1

      **Definições:**<br/>
      Ativo = 1
  Number:
    type: integer