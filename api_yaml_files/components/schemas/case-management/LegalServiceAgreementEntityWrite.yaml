title: "Legal service agreement to create"
type: object
properties:
  ClientId:
    type: string
    format: uuid
    description: "**Client's unique identifier**"
  Name:
    type: string
    description: "Legal service agreement's title"
  Summary:
    type: string
    description: "Legal service agreement's summary"
  StartDate:
    type: string
    format: datetime
    description: "Legal service agreement's start date"
  ForecastedEndDate:
    type: string
    format: datetime
    description: "Legal service agreement's forecasted end date"
  DueDate:
    type: string
    format: datetime
    description: "Legal service agreement's due date"
  IsSameReviewerAttorneyFeesAndExpenses:
    type: boolean
  IsSamePayerAttorneyFeesAndExpenses:
    type: boolean
  BillingCompanyId:
    type: string
    format: uuid
  OwnerId:
    type: string
    format: uuid
  Number:
    type: integer
  IsDefault: 
    type: boolean
    description: "Indica se é o contrato default do cliente"
  KilometersReimbursement:
    type: string
    description: |
      ESCRITORIO<br/>
      CONTRATO

      **Definições:**<br />
      ESCRITORIO = 1<br />
      CONTRATO = 2
  ExpenseRuleLocal:
    type: string
    description: |
      **Valores permitidos:**<br/>
      1<br/>
      2<br/>
      3<br/>
      4<br/>
      5<br/>
      6

      **Definições:**<br />
      REGRAESCRITORIO = 1<br/>
      REGRAEMPRESA = 2<br/>
      REGRACLIENTE = 3<br/>
      REGRACONTRATO = 4<br/>
      REGRAPROCESSO = 5<br/>
      REGRAVAZIA = 6
required:
  - ClientId
  - Name
  - StartDate
  - IsSameReviewerAttorneyFeesAndExpenses
  - IsSamePayerAttorneyFeesAndExpenses
  - KilometersReimbursement
  - ExpenseRuleLocal
  - BillingCompanyId
  - OwnerId