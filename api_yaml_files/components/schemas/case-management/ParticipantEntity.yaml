title: Dados de Parte
type: object
allOf:
  - $ref: ../scim/Resource.yaml
  - type: object
    properties:
      Id:
        description: "**Partcipant's unique identifier**"
        type: string
        format: uuid
      ClientId: 
        type: string
        format: uuid
        description: "Se a parte for um cliente"
      EmployeeId: 
        type: string
        format: uuid
        description: "Se a parte for um funcionário"
      CaseId: 
        type: string
        format: uuid
        description: "Identificador único do caso"
      CreatedBy: 
        $ref: "SimpleEntityWrite.yaml"
      Name:
        type: string
        description: "**Participant's name**"
      Nickname:
        type: string <nullable>
        description: "**Apelido**"
      IsMainParty:
        type: bool
        description: "**Indica se é a parte principal**"
      Represents:
        oneOf:
          - type: array
            items:
            - type: string
              description: "Documento da parte representada"
            - type: string
              format: uuid
              description: "Unique identifier da parte representada"
      LawyerOffice:
        type: string <nullable>
        description: "Escritório do advogado (se houver)"
      
      # TODO: verificar se o enum está assim mesmo
      Nature:
        type: string
        example: "NATURAL_PERSON"
        description: |
          **Natureza**<br />
          NATURAL_PERSON<br />
          LEGAL_PERSON

      # TODO: verificar se o enum está assim mesmo
      Position:
        type: string
        example: "OTHER"
        description: |
          **Posição do participante**<br />
          **Valores permitidos:<br/>**
          ACTIVE<br/>
          PASSIVE<br/>
          THIRD<br/>
          NEITHER<br/>
          OTHER<br/>

          **Definições:<br/>**
          ACTIVE = (Ativo)<br />
          PASSIVE = (Passivo)<br />
          THIRD = (Terceiro)<br />
          NEITHER = (Nenhum)<br />
          OTHER = (Outro envolvido)
      Addresses:
        description: "**Endereços**"
        type: array
        items:
          $ref: AddressEntity.yaml
      Emails:
        description: "**Emails**"
        type: array
        items:
          $ref: EmailEntity.yaml
      Identities:
        description: "**CNPJ, Inscrição estadual, Inscrição municipal, CPF, RG, etc.**"
        type: array
        items:
          $ref: IdentityEntity.yaml
      CustomFields:
        type: string
        example: {}
        description: "**Participant's custom fields**"
      PhoneNumbers:
        description: "**Telefones**"
        type: array
        items:
          $ref: PhoneNumberEntity.yaml