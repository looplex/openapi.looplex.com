title: Email
type: object
properties:
  Value:
    description: "Email addresses for the user.  The value SHOULD be canonicalized by the service provider, e.g., 'bjensen@example.com' instead of 'bjensen@EXAMPLE.COM'.<br />Canonical type values of `'work', 'home', and 'other'`"
    type: string
  Type:
    description: "A label indicating the attribute's function, e.g., 'work' or 'home' <br />AllowedValues: `"work", "home", "other"`"
    type: string
  Primary:
    description: "A Boolean value indicating the 'primary' or preferred attribute value for this attribute, e.g., the preferred mailing address or primary email address. <br /><b>The primary attribute value 'true' MUST appear no more than once.</b>"
    type: boolean