title: Participante
type: object
properties: 
  CreatedBy:
    type: string
    format: uuid
    description: "Cliente que está efetuando o cadastro"
  Name:
    type: string
    description: "**Participant name**"
  Nickname:
    type: string <nullable>
    description: "**Apelido**"
  IsMainParty:
    type: bool
    example: false
    description: "**Indica se é a parte principal**"
  Represents:
    type: array
    items:
      type: string
      format: uuid
    description: "**UUID do participante que está sendo representado**"
  Nature:
    type: string
    example: "NATURAL_PERSON"
    description: |
      **Natureza**<br />
      NATURAL_PERSON<br />
      LEGAL_PERSON
  Position:
    type: string
    example: "OTHER"
    description: |
      **Posição do participante**<br />
      **Valores permitidos:<br/>**
      ACTIVE<br/>
      PASSIVE<br/>
      THIRD<br/>
      NEITHER<br/>
      OTHER<br/>

      **Definições:<br/>**
      ACTIVE = (Ativo)<br />
      PASSIVE = (Passivo)<br />
      THIRD = (Terceiro)<br />
      NEITHER = (Nenhum)<br />
      OTHER = (Outro envolvido)
  # Addresses:
  #   type: array
  #   items:
  #     $ref: AddressEntity.yaml
  #   description: "**Endereços**"
  Emails:
    type: array
    items:
      $ref: EmailEntity.yaml
    description: "**Emails da parte**"
  Identities:
    type: array
    items:
      $ref: IdentityEntityWrite.yaml
    description: "**Identidades da parte**"
  # PhoneNumbers:
  #   description: "**Telefones**"
  #   type: array
  #   items:
  #     $ref: PhoneNumberEntity.yaml