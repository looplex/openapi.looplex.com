title: Timesheet
type: object
allOf:
  - $ref: ../scim/Resource.yaml
  - type: object
    properties:
      ClientId:
        type: string
        format: uuid
        description: "**Client unique identifier**"
      Classification:
        type: string <nullable>
        description: "**Classificação**"
      Owner:
        $ref: SimpleEntity.yaml
        description: "**Responsável**"
      Date:
        type: string
        format: datetime
        description: "**Data**"
      Hours:
        type: string
        example: "01:00:00"
        description: |
          **Horas (quantidade de horas do lançamento)**<br />
          `Format: hh:mm:ss`
      TaskCode:
        type: string <nullable>
        description: "**Código da Tarefa**"
      ActivityCode:
        type: string <nullable>
        description: "**Código da Atividade**<br />"
      Applicant:
        $ref: SimpleEntity.yaml
        description: "**Solicitante**<br />"
      Description:
        type: string <nullable>
        description: "**Descrição**"
      IsInvoiced:
        type: boolean <nullable>
        description: "**Faturado**"
      CreatedAt:
        type: string <nullable>
        format: datetime
        description: "**Criado em**"
      CreatedBy:
        $ref: SimpleEntity.yaml
        description: "**Criado por**"
      UpdatedAt:
        type: string <nullable>
        format: datetime
        description: "**Atualizado em**"
      UpdatedBy:
        $ref: SimpleEntity.yaml
        description: "**Atualizado por**"
      Case:
        type: object
        description: "**The case unique identifier**"
        properties:
          Id:
            type: string
            format: uuid
      TaskType:
        type: string <nullable>