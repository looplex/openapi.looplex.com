title: Dados de timesheet para inclusão
type: object
properties:
  ClientId:
    type: string
    format: uuid
    description: "**Client unique identifier**"
  Classification:
    description: "**Classificação**"
    type: string <nullable>
  Owner:
    description: "**Responsável**"
    $ref: SimpleEntityWrite.yaml
  Date:
    description: "**Data**"
    type: string
    format: datetime
    example: "2025-01-01T12:00:00.000Z"
  Hours:
    description: |
      **Horas (quantidade de horas do lançamento)**<br />
      `Format: hh:mm:ss`
    type: string
    example: "01:00:00"
  TaskCode:
    type: string <nullable>
    description: "**Código da Tarefa**"
  ActivityCode:
    type: string <nullable>
    description: "**Código da Atividade**<br />"
  Applicant:
    $ref: SimpleEntityWrite.yaml
    description: "**Solicitante**<br />"
  Description:
    type: string
    description: "**Descrição**"
  CreatedBy:
    $ref: SimpleEntityWrite.yaml
    description: "**Criado por**"
  Case:
    $ref: SimpleEntityWrite.yaml
    description: "**The case unique identifier**"