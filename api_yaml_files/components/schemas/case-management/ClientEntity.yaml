title: Cliente
type: object
description: |
  **Cliente**<br />
  Qualquer pessoa ou entidade que contrata ou retém uma equipe jurídica para gerenciar ou conduzir atividades em um caso em seu nome
allOf:
  - $ref: '../scim/Resource.yaml'
properties:
  Name:
    type: string
    description: "The client's name"
    example: "Example name"
  NickName:
    type: string
    description: "The client's nickname"
    example: "Example"
  Type:
    $ref: enums/TipoPessoa.yaml
  Email:
    type: string <nullable>
    description: "The client's email address"
    example: null
  Website:
    type: string <nullable>
    description: "The client's website page"
    example: null
  Comments:
    type: string <nullable>
    description: "Comments about the client"
    example: null
  Identities:
    type: array
    items:
      $ref: IdentityEntity.yaml