title: "Client"
type: object
allOf:
  - $ref: '../scim/Resource.yaml'
properties:
  Name:
    type: string
    description: "The client's name"
    example: "Example name"
  NickName:
    type: string
    description: "The client's nickname"
    example: "Example"
  Type:
    type: string
    description: |
      **The client type**<br />
      NATURAL_PERSON = (Pessoa física)<br />
      LEGAL_PERSON = (Pessoa juridica)
    example: "NATURAL_PERSON"
  Email:
    type: string <nullable>
    description: "The client's email address"
    example: null
  Website:
    type: string <nullable>
    description: "The client's website page"
    example: null
  Comments:
    type: string <nullable>
    description: "Comments about the client"
    example: null
  Identities:
    type: array
    items:
      $ref: IdentityEntity.yaml