title: Dados de caso para inclusão
type: object
properties:
  Type:
    type: string
    example: "Judicial Estadual"
    description: |
      **Indicação do tipo de caso, define o tipo de justiça ou o tipo de transação jurídica**<br />
      **Valores permitidos:**<br />
      Administrativo<br />
      Consultivo<br />
      Judicial Estadual<br />
      Judicial Federal<br />
      Judicial Trabalhista<br />
      Militar Estadual<br />
      Eleitoral<br />
      Militar União<br />
      Contrato<br />
      Due Diligence e Análise Documental<br />
      Cobrança Extrajudicial<br />
      Societário<br />
      Arbitragem
  SubType:
    type: string
    example: "Caso"
    description: |
      **Indicação do subtipo de caso, define se ele é um caso originário ou uma continuação como um recurso, incidente ou um subcaso**<br />
      **Valores permitidos:**<br />
      Caso<br />
      Subcaso<br />
      Recurso<br />
      Incidente
  Identities:
    description: |
      **Identificação do caso, como número CNJ, NIRE, Número do contrato, ids de sistemas externos, etc**
    type: array
    items:
      $ref: IdentityEntityWrite.yaml
    example:
      - IdentityProviderType: "CNJ"
        Value: "0000000-00.0000.0.00.0000"
  Title:
    description: "**Nome Jurídico do caso**"
    type: string <nullable>
    example: "Titulo do caso"
  Summary:
    description: "**Breve descrição sobre o caso**"
    type: string <nullable>
    example: "Descrição do caso"
  Locale:
    type: string <nullable>
    example: null
    description: |
      **Utilizado em casos consultivos**<br />
      **Formato: País - Estado - Cidade**<br />
      Local da Jurisdição de um caso, ou cumprimento da obrigação.
  CourtVenue:
    type: string <nullable>
    example: "Brasil - São Paulo - SP"
    description: |
      **Utilizado para casos contenciosos, judiciais ou não**<br />
      Foro do caso, local onde o caso será julgado
  CaseProcedure:
    type: string <nullable>
    example: "Rito do caso"
    description: "**Rito ou procedimento do caso**"
  Phase:
    type: string <nullable>
    example: "Fase do caso"
    description: | 
      **Fase do caso**<br />
      Etapas que determinam os procedimentos que devem ser seguidos para a resolução do caso
  Nature:
    description: "**Indica os assuntos tratados no caso**"
    example: ["Natureza"]
    type: array
    items:
      type: string
  RetentionDate:
    type: string <nullable>
    format: datetime
    example: "2025-05-29T12:00:00.000Z"
    description: |
      **Data de entrada** <br />
      Data em que a organização (escritório de advocacia ou departamento jurídico) foi oficialmente contratada pelo cliente para representar ou gerenciar o caso
  StartDate:
    type: string <nullable>
    format: datetime
    example: "2025-05-29T12:00:00.000Z"
    description: |
      **Data de distribuição**<br />
      Data em que um caso foi distribuído para um tribunal em disputas ou data em que um contrato ou negócio jurídico foi assinado pelas partes
  FormationDate:
    type: string <nullable>
    format: datetime
    example: "2025-05-29T12:00:00.000Z"
    description: |
      **Data de citação**<br />
      Data em que uma ação judicial ou negócio se torna ativo. Para disputas, é a data da citação. <br />
      Para contratos e atos societários, é a data em que o instrumento entra em vigor ou se torna exigível
  ResJudicataDate:
    type: string <nullable>
    format: datetime
    example: "2025-05-29T12:00:00.000Z"
    description: |
      **Data de trânsito em julgado**<br />
      Data em que uma decisão se torna final e irrecorrível, tornando a sentença conclusiva e obrigatória. <br />
      A partir dessa data, o caso não pode ser reaberto ou contestado. Utilizado apenas para casos judiciais
  ForecastedEndDate:
    type: string <nullable>
    format: datetime
    example: "2025-05-29T12:00:00.000Z"
    description: |
      **Data prevista para encerramento**<br />
      Data estimada para a conclusão de um caso, transação ou disputa. <br />
      Essa data é utilizada para fins de planejamento e pode ser ajustada conforme o andamento do caso
  Group:
    type: string <nullable>
    example: "Área"
    description: |
      **Área** <br />
      Grupo ou área do escritório de advocacia ou departamento jurídico responsável pelo caso
  Product:
    description: |
      **Produto**<br />
      Produto ou serviço do cliente que está relacionado ao caso
    example: ["Produto"]
    type: array
    items:
      type: string
  CaseClient:
    description: |
      **Cliente**<br />
      Qualquer pessoa ou entidade que contrata ou retém uma equipe jurídica para gerenciar ou conduzir atividades em um caso em seu nome
    $ref: SimpleEntityWrite.yaml
  LegalServiceAgreement:
    description: |
      **Contrato**<br />
      Contrato de prestação de serviços jurídicos que rege a relação entre o escritório de advocacia ou departamento jurídico e o cliente
    $ref: SimpleEntityWrite.yaml
  Owner:
    description: |
      **Responsável**<br />
      Advogado ou membro da equipe jurídica responsável pelo caso
    $ref: SimpleEntityWrite.yaml
  Coowners:
    description: |
      **Corresponsáveis**<br />
      Advogados ou membros da equipe jurídica que compartilham a responsabilidade pelo caso
    type: array
    items:
      $ref: SimpleEntityWrite.yaml
  ExternalServiceProvider:
    description: |
      **Escritório Responsável / Correspondente**<br />
      Prestador de serviços externo contratado para fornecer serviços jurídicos em um caso
    $ref: SimpleEntityWrite.yaml
  GlobalValues:
    description: |
      **Valores globais do caso, definidos por polo**
    type: array
    items:
      $ref: GlobalValuesWrite.yaml
    example:
      - AgainstPosition: "Ativo"
        Perspective: "Êxito"
        Risk: "Provável"
        Currency: "BRL"
        CaseDeclaredValue: 1
        CaseForeseenValue: 1
        CaseContingencyValue: 1
      - AgainstPosition: "Passivo"
        Perspective: "Êxito"
        Risk: "Provável"
        Currency: "BRL"
        CaseDeclaredValue: 1
        CaseForeseenValue: 1
        CaseContingencyValue: 1
      - AgainstPosition: "Terceiro"
        Perspective: "Êxito"
        Risk: "Provável"
        Currency: "BRL"
        CaseDeclaredValue: 1
        CaseForeseenValue: 1
        CaseContingencyValue: 1