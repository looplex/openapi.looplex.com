title: Tag group
type: object
properties:
  Id:
    example: -2147483648
    description: "**Item's identifier**"
    type: integer
  UUID:
    description: "**Unique identifier of tag's group**"
    type: string
    format: uuid
  Label:
    type: string
    example: "SP"
    description: "**The name of tag's group**"
  Active:
    type: boolean
    example: true
    description: "**Indicate if it is active**"
  Status:
    type: integer
    example: 1
    description: "**Tag's status**"
  Type:
    type: string
    example: "ESTADO_COMARCA"
    description: |
      **Indicate the group's type**<br/>
      **Possible values:**<br/>
      INSTANCIA = 1<br/>
      ESTADO_COMARCA = 2<br/>
      RITO = 3
  Tags:
    type: array
    items:
      $ref: Tag.yaml
  ExternalId:
    description: "**Item's external identifier**"
    type: string <nullable>
  Meta:
    $ref: ../scim/Meta.yaml