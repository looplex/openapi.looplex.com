tags:
  - Tasks
summary: "/tasks/:task_id"
description: |
  **Delete a task by id**
operationId: tasks-task_id-delete
parameters:
  - $ref: ../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../parameters/common/Tenant.yaml
  - $ref: ../parameters/common/BearerToken.yaml
  - name: task_id
    in: path
    required: true
    description: "**Task id**"
    schema:
      type: string
      format: uuid
responses:
  "204":
    description: "No Content"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: "../responses/InternalServerErrorResponse.yaml"
