# Linhas com # são comentários e podem ser removidas.
tags:
  - Tasks
summary: "/tasks"
description: |
  **Fetch tasks paginated**
operationId: tasks-get
# Parâmetros da requisição
parameters:
  - $ref: ../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../parameters/common/Tenant.yaml
  - $ref: ../parameters/common/BearerToken.yaml
  - name: startIndex
    in: query
    required: true
    description: "**Index of search**"
    example: 1
    schema:
      type: integer
  - name: count
    in: query
    required: true
    description: "**Total count of items to return**<br />`Max of 120`"
    example: 50
    schema:
      type: integer
  - name: filter
    in: query
    required: false
    description: |
      **SCIM filter to search**<br />
      **e.g:**<br />
      _Title_ _co_ _search_term_
    schema:
      type: string
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  # Preencha o path do schema de retorno '<response_dto_relative_path_and_name>'
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../schemas/common/ListResponse.yaml'
            - type: object
              properties:
                Resources:
                  type: array
                  items:
                    $ref: ../schemas/common/TaskEntityQuery.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: "../responses/InternalServerErrorResponse.yaml"