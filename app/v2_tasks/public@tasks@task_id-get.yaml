# Linhas com # são comentários e podem ser removidas.
tags:
  - Tasks
summary: "/tasks/:task_id"
description: |
  **Retrieve a task by id**
operationId: tasks-task_id-get
# Parâmetros da requisição
parameters:
  - $ref: ../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../parameters/common/Tenant.yaml
  - $ref: ../parameters/common/BearerToken.yaml
  - name: task_id
    in: path
    required: true
    description: "**Task id**"
    schema:
      type: string
      format: uuid
# Responses
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: "../schemas/common/TaskEntity.yaml"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: "../responses/InternalServerErrorResponse.yaml"
