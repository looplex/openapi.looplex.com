title: Dados da tarefa
type: object
properties:
  ParentTaskId:
    type: string <nullable>
    format: uuid
    description: "**Unique identifier of parent task**"
  Type:
    $ref: ../../enums/common/TaskType.yaml
    example: COURT_HEARING
  Title:
    type: string <nullable>
    description: "**Titulo**"
  Description:
    type: string <nullable>
    description: "**Descrição**"
  StartDate:
    type: string <nullable>
    format: datetime
    description: "**Data de Início**"
  DueDate:
    type: string <nullable>
    format: datetime
    description: "**Data de Vencimento**"
  Locale:
    type: string <nullable>
    description: "**Local**"
  TaskCode:
    type: string <nullable>
    description: "**Código da Tarefa**"
  ActivityCode:
    type: string <nullable>
    description: "**Código da Atividade**"
  Owner:
    $ref: SimpleEntityWrite.yaml
    description: "**Responsável**"
  OtherParticipants:
    description: "**Outros Participantes**"
    type: array
    items:
      $ref: SimpleEntityWrite.yaml
  Status:
    $ref: ../../enums/common/StatusTarefa.yaml
    example: CREATED
  Priority:
    example: LOW
    $ref: ../../enums/common/Prioridade.yaml
  Case:
    description: "**Caso de uma tarefa**"
    type: object
    properties:
      Id:
        type: string
        format: uuid
        description: |
          **Case's unique identifier**<br/>
          `Obrigatório apenas quando a tarefa não estiver sendo criada junto com o caso`
  CustomFields:
    type: object
    example: {}
    description: "**Tasks's custom fields**"