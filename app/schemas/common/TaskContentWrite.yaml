title: Dados da tarefa
type: object
properties:
  ParentTaskId:
    type: [string, null]
    format: uuid
    description: "**Unique identifier of parent task**"
    example: null
  Type:
    $ref: ../../enums/common/TaskType.yaml
    example: COURT_HEARING
  Title:
    type: [string, null]
    example: <title>
    description: "**Titulo**"
  Description:
    type: [string, null]
    example: <description>
    description: "**Descrição**"
  StartDate:
    type: [string, null]
    format: datetime
    example: <start_date>
    description: |
      **Data de Início**<br/>
      _Date must be send in UTC timezone_
  DueDate:
    type: [string, null]
    format: datetime
    example: <due_date>
    description: |
      **Data de Vencimento**<br/>
      _Date must be send in UTC timezone_
  Locale:
    type: [string, null]
    example: <locale>
    description: "**Local**"
  TaskCode:
    type: [string, null]
    example: <task_code>
    description: "**Código da Tarefa**"
  ActivityCode:
    type: [string, null]
    example: <activity_code>
    description: "**Código da Atividade**"
  TaskTemplate:
    $ref: SimpleEntityWrite.yaml
    description: "**Modelo de Tarefa**"
  Owner:
    $ref: SimpleEntityWrite.yaml
    description: "**Responsável**"
  OtherParticipants:
    description: "**Outros Participantes**"
    type: array
    items:
      $ref: SimpleEntityWrite.yaml
  Status:
    $ref: ../../enums/common/StatusTarefa.yaml
    example: <status>
  Priority:
    example: <priority>
    $ref: ../../enums/common/Prioridade.yaml
  CustomFields:
    type: object
    example: {}
    description: "**Tasks's custom fields**"
  Case:
    $ref: SimpleEntityWrite.yaml
    description: "**Processo**"
  TaskHierarchy:
    $ref: TaskHierarchyWrite.yaml

