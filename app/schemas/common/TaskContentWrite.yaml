title: Dados da tarefa
type: object
properties:
  parentTaskId:
    type: [string, null]
    format: uuid
    description: "**Unique identifier of parent task**"
    example: null
  type:
    $ref: ../../enums/common/TaskType.yaml
    example: COURT_HEARING
  title:
    type: [string, null]
    example: <title>
    description: "**Titulo**"
  description:
    type: [string, null]
    example: <description>
    description: "**Descrição**"
  startDate:
    type: [string, null]
    format: date-time
    example: <start_date>
    description: |
      **Data de Início**<br/>
      _Date must be send in UTC timezone_
  dueDate:
    type: [string, null]
    format: date-time
    example: <due_date>
    description: |
      **Data de Vencimento**<br/>
      _Date must be send in UTC timezone_
  locale:
    type: [string, null]
    example: <locale>
    description: "**Local**"
  taskCode:
    type: [string, null]
    example: <task_code>
    description: "**Código da Tarefa**"
  activityCode:
    type: [string, null]
    example: <activity_code>
    description: "**Código da Atividade**"
  taskTemplate:
    $ref: SimpleEntityWrite.yaml
    description: "**Modelo de Tarefa**"
  owner:
    $ref: SimpleEntityWrite.yaml
    description: "**Responsável**"
  otherParticipants:
    description: "**Outros Participantes**"
    type: array
    items:
      $ref: SimpleEntityWrite.yaml
  status:
    $ref: ../../enums/common/StatusTarefa.yaml
    example: <status>
  priority:
    example: <priority>
    $ref: ../../enums/common/Prioridade.yaml
  customFields:
    type: object
    example: {}
    description: "**Tasks's custom fields**"
  case:
    $ref: SimpleEntityWrite.yaml
    description: "**Processo**"
  taskHierarchy:
    $ref: TaskHierarchyWrite.yaml

