title: Dados da tarefa
type: object
properties:
  ParentTaskId:
    type: [string, "null"]
    format: uuid
    description: "**Unique identifier of parent task**"
  Type:
    $ref: ../../enums/common/TaskType.yaml
    example: COURT_HEARING
  SubType:
    type: [string, "null"]
    description: "**Subtype of the task**"
  Title:
    type: [string, "null"]
    description: "**Titulo**"
  Description:
    type: [string, "null"]
    description: "**Descrição**"
  StartDate:
    type: [string, "null"]
    format: datetime
    description: "**Data de Início**"
  DueDate:
    type: [string, "null"]
    format: datetime
    description: "**Data de Vencimento**"
  CreatedBy:
    $ref: SimpleEntityWrite.yaml
    description: "**Criado por**"
  UpdatedBy:
    $ref: SimpleEntityWrite.yaml
    description: "**Atualizado por**"
  CompletedAt:
    type: [string, "null"]
    format: datetime
    description: "**Concluído em**"
  CompletedBy:
    $ref: SimpleEntityWrite.yaml
    description: "**Concluído por**"
  Locale:
    type: [string, "null"]
    description: "**Local**"
  TaskCode:
    type: [string, "null"]
    description: "**Código da Tarefa**"
  ActivityCode:
    type: [string, "null"]
    description: "**Código da Atividade**"
  TaskTemplate:
    $ref: SimpleEntityWrite.yaml
    description: "**Modelo de Tarefa**"
  Owner:
    $ref: SimpleEntityWrite.yaml
    description: "**Responsável**"
  OtherParticipants:
    description: "**Outros Participantes**"
    type: array
    items:
      $ref: SimpleEntityWrite.yaml
  Status:
    $ref: ../../enums/common/StatusTarefa.yaml
    example: CREATED
  Priority:
    example: LOW
    $ref: ../../enums/common/Prioridade.yaml
  ConclusionNotes:
    type: [string, "null"]
    description: "**Notas de Conclusão**"
  CustomFields:
    type: object
    example: {}
    description: "**Tasks's custom fields**"
  TaskHierarchy:
    $ref: TaskHierarchyWrite.yaml

