title: Dados da tarefa
type: object
properties:
  ParentTaskId:
    type: string <nullable>
    format: uuid
    description: "**Unique identifier of parent task**"
  Type:
    $ref: ../../enums/common/TaskType.yaml
    example: COURT_HEARING
  SubType:
    type: string <nullable>
    description: "**Subtype of the task**"
  Title:
    type: string <nullable>
    description: "**Titulo**"
  Description:
    type: string <nullable>
    description: "**Descrição**"
  StartDate:
    type: string <nullable>
    format: datetime
    description: "**Data de Início**"
  DueDate:
    type: string <nullable>
    format: datetime
    description: "**Data de Vencimento**"
  CreatedBy:
    $ref: SimpleEntityQuery.yaml
    description: "**Criado por**"
  UpdatedBy:
    $ref: SimpleEntityQuery.yaml
    description: "**Atualizado por**"
  CompletedAt:
    type: string <nullable>
    format: datetime
    description: "**Concluído em**"
  CompletedBy:
    $ref: SimpleEntityQuery.yaml
    description: "**Concluído por**"
  Locale:
    type: string <nullable>
    description: "**Local**"
  TaskCode:
    type: string <nullable>
    description: "**Código da Tarefa**"
  ActivityCode:
    type: string <nullable>
    description: "**Código da Atividade**"
  TaskTemplate:
    $ref: SimpleEntityQuery.yaml
    description: "**Modelo de Tarefa**"
  Owner:
    $ref: SimpleEntityQuery.yaml
    description: "**Responsável**"
  OtherParticipants:
    description: "**Outros Participantes**"
    type: array
    items:
      $ref: SimpleEntityQuery.yaml
  Status:
    $ref: ../../enums/common/StatusTarefa.yaml
    example: CREATED
  Priority:
    example: LOW
    $ref: ../../enums/common/Prioridade.yaml
  ConclusionNotes:
    type: string <nullable>
    description: "**Notas de Conclusão**"
  CustomFields:
    type: object
    example: {}
    description: "**Tasks's custom fields**"
  Case:
    description: "Caso de uma tarefa"
    type: object
    properties:
      Id:
        type: string
        format: uuid
        description: "**Case's unique identifier**"
      Title:
        type: string
        description: "**Case title**"
      Identities:
        type: array
        items:
          $ref: LegacyIdentityEntityQuery.yaml
      Group:
        type: string
        description: "Case's group"
      ClientName:
        type: string
        description: "Case's client name"
      PrincipalActivePosition:
        type: string
        description: "Case's principal active position"
      PrincipalPassivePosition:
        type: string
        description: "Case's principal passive position"
      Locale:
        type: string
        description: "Case's locale"  
  Identities:
    type: array
    items:
      $ref: LegacyIdentityEntityQuery.yaml
  HasAncestor:
    type: boolean
    description: "**Indicates if the task has ancestor tasks**"
  HasDescendant:
    type: boolean
    description: "**Indicates if the task has descendant tasks**"
