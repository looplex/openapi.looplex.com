title: Timesheet
type: object
allOf:
  - $ref: ../../scim/ResourceRetrieve.yaml
  - type: object
    properties:
      clientId:
        type: string
        format: uuid
        description: "**Client unique identifier**"
        example: <global_unique_identifier>
      classification:
        type: string <nullable>
        description: "**Classificação**"
        example: <classificacao>
      owner:
        $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
        description: "**Responsável**"
      date:
        type: string
        format: datetime
        description: "**Data**"
        example: <data>
      hours:
        type: string
        example: <hora>
        description: |
          **Horas (quantidade de horas do lançamento)**<br />
          `Format: hh:mm:ss`
      taskCode:
        type: string <nullable>
        description: "**Código da Tarefa**"
        example: <codigo_da_tarefa>
      activityCode:
        type: string <nullable>
        description: "**Código da Atividade**"
        example: <codigo_da_atividade>
      applicant:
        $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
        description: "**Solicitante**"
      description:
        type: string <nullable>
        example: <descricao>
        description: "**Descrição**"
      isInvoiced:
        type: boolean <nullable>
        example: false
        description: "**Faturado**"
      createdAt:
        type: string <nullable>
        format: datetime
        example: <data_de_criacao>
        description: "**Criado em**"
      createdBy:
        $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
        description: "**Criado por**"
      updatedAt:
        type: string <nullable>
        format: datetime
        description: "**Atualizado em**"
        example: <data_de_atualizacao>
      updatedBy:
        $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
        description: "**Atualizado por**"
      case:
        type: object
        description: "**The case unique identifier**"
        properties:
          id:
            type: string
            format: uuid
            example: <global_unique_identifier>
      taskType:
        $ref: ../../enums/v2_case-management/TipoDeTarefaTimesheet.yaml