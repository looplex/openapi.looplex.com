title: Dados de Parte
type: object
allOf:
  - $ref: ../../scim/ResourceRetrieve.yaml
  - type: object
    properties:
      clientId:
        type: string
        format: uuid
        example: <client_uuid>
        description: |
          **Client's unique identifier**<br/>
          This property if filled if the participant is a client
      employeeId:
        type: string
        format: uuid
        example: <employee_uuid>
        description: |
          **Employee's unique identifier**<br/>
          This property if filled if the participant is an employee
      caseId:
        type: string
        format: uuid
        example: <case_uuid>
        description: |
          **The participant's case**
      createdBy:
        $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
      name:
        type: string
        example: <nome_da_parte>
        description: "**Participant's name**"
      nickname:
        type: string <nullable>
        example: <apelido_da_parte>
        description: "**Apelido**"
      isMainParty:
        type: boolean
        example: <is_main_party>
        description: |
          **Indicate if this participant is the main party in this case**
      represents:
        type: array
        items:
          type: string
        example: ["document", "uuid"]
        description: |
          **Documents or uuids of parties represented by this participant (if this participant is a lawyer)**
      lawyerOffice:
        type: string <nullable>
        description: "**Escritório do advogado (se houver)**"
        example: <escritorio>
      nature:
        example: NATURAL_PERSON
        $ref: ../../enums/v2_case-management/TipoPessoa.yaml
      position:
        example: ACTIVE
        $ref: ../../enums/v2_case-management/Position.yaml
      addresses:
        description: "**Participant's addresses**"
        type: array
        items:
          $ref: AddressEntityRetrieve.yaml
      emails:
        description: "**E-mails**"
        type: array
        items:
          $ref: EmailEntityRetrieve.yaml
      identities:
        description: "**Participant's identities**"
        type: array
        items:
          oneOf:
            - $ref: ../../schemas/common/NaturalPersonIdentityEntityRetrieve.yaml
            - $ref: ../../schemas/common/LegalPersonIdentityEntityRetrieve.yaml
      phoneNumbers:
        description: "**Telefones**"
        type: array
        items:
          $ref: PhoneNumberEntityRetrieve.yaml
      role:
        $ref: ../../enums/v2_case-management/ParticipantRole.yaml
      customFields:
        type: object
        example: {}
        description: "**Participant's custom fields**"
      caseType:
        $ref: ../../enums/common/RamosJudicial.yaml
      businessStructure:
        type: string
      dob:
        type: string
        format: datetime
        description: |
          **Date of birth (NATURAL_PERSON only)**
      gender:
        $ref: ../../enums/v2_case-management/Gender.yaml
        description: |
          **Gender (NATURAL_PERSON only)**
      nationality:
        type: string
      maritalStatus:
        $ref: ../../enums/v2_case-management/MaritalStatus.yaml
      occupation:
        type: string