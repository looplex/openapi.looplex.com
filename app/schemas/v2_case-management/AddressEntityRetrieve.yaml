title: Address
type: object
allOf:
  - $ref: ../../scim/ResourceRetrieve.yaml
  - type: object
    properties:
      country:
        type: string <nullable>
        example: <pais>
        description: "**ISO 3166-1 alpha2 value (2 caracteres)**"
      postalCode:
        type: string <nullable>
        example: <cep>
        description: "**Postal code**"
      streetAddress:
        type: string
        example: <logradouro>
        description: "**Street**"
      streetAddressNumber:
        type: string <nullable>
        example: <numero_do_logradouro>
        description: "**Street number**"      
      locality:
        type: string <nullable>
        example: <cidade>
        description: "**Cidade**"
      region:
        type: string <nullable>
        example: <sigla_estado>
        description: "**State**"      
      extendedAddress:
        type: string
        description: "**Extended address**"
        example: <complemento>
      type:
        $ref: ../../enums/v2_case-management/AddressType.yaml
      primary:
        type: boolean
        example: true
        description: "**Is this the main address?**"
      customFields:
        type: object
        description: "**Address' custom fields**"