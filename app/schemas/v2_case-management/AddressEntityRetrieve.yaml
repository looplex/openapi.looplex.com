title: Address
type: object
allOf:
  - $ref: ../../scim/ResourceRetrieve.yaml
  - type: object
    properties:
      country:
        $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
        description: "**ISO 3166-1 alpha2 value (2 caracteres)**"
      postalCode:
        type: [string, "null"]
        example: <cep>
        description: "**Postal code**"
      streetAddress:
        type: string
        example: <logradouro>
        description: "**Street**"
      streetAddressNumber:
        type: [string, "null"]
        example: <numero_do_logradouro>
        description: "**Street number**"
      locality:
        $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
        description: "**Cidade**"
      region:
        $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
        description: "**State**"
      extendedAddress:
        type: string
        description: "**Extended address**"
        example: <complemento>
      type:
        $ref: ../../enums/v2_case-management/AddressType.yaml
      contextId:
        type: [string, "null"]
        format: uuid
        description: "**Identifier of the owner (client, employee, etc.) of this address**"
        example: <global_unique_identifier>
      primary:
        type: boolean
        example: true
        description: "**Is this the main address?**"
      customFields:
        type: object
        description: "**Address' custom fields**"