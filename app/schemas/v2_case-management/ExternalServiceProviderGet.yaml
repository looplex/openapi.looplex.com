title: External service provider
type: object
allOf:
  - $ref: ../../scim/ResourceGet.yaml
  - type: object
    properties:
      name:
        type: string
        example: <name>
        description: "**External service provider's name**"
      phone:
        $ref: PhoneNumberEntityGet.yaml
      address:
        $ref: AddressEntityGet.yaml
      summary:
        type: string
        example: <summary>
        description: "**External service provider's summary**"
      identities:
        type: array
        items:
          $ref: ../common/LegacyIdentityEntityGet.yaml
      type:
        $ref: ../../enums/v2_case-management/TipoPessoa.yaml
      emails:
        type: array
        items:
          $ref: EmailEntityGet.yaml
      status:
        $ref: ../../enums/v2_case-management/BooleanStatus.yaml
      customFields:
        type: object
        example: {}
        description: "**Custom fields for this item**"
      collaborators:
        type: array
        description: "**Collaborators linked to this external service provider** (read-only, ordered by name, including inactive ones)"
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: "**Collaborator's unique identifier**"
            name:
              type: [string, "null"]
              description: "**Collaborator's name**"
              example: <nome>
            email:
              type: [string, "null"]
              description: "**Collaborator's e-mail**"
              example: <email>