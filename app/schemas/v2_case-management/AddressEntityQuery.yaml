title: Address
type: object
allOf:
  - $ref: ../../scim/ResourceQuery.yaml
  - type: object
    properties:
      Country:
        $ref: ../../schemas/common/SimpleEntityQuery.yaml
        description: "**ISO 3166-1 alpha2 value (2 caracteres)**"
      PostalCode:
        type: [string, "null"]
        example: <cep>
        description: "**Postal code**"
      StreetAddress:
        type: string
        example: <logradouro>
        description: "**Street**"
      StreetAddressNumber:
        type: [string, "null"]
        example: <numero_do_logradouro>
        description: "**Street number**"
      Locality:
        $ref: ../../schemas/common/SimpleEntityQuery.yaml
        description: "**Cidade**"
      Region:
        $ref: ../../schemas/common/SimpleEntityQuery.yaml
        description: "**State**"
      ExtendedAddress:
        type: string
        description: "**Extended address**"
        example: <complemento>
      Type:
        $ref: ../../enums/v2_case-management/AddressType.yaml
      ContextId:
        type: [string, "null"]
        format: uuid
        description: "**Identifier of the owner (client, employee, etc.) of this address**"
        example: <global_unique_identifier>
      Primary:
        type: boolean
        example: true
        description: "**Is this the main address?**"
      CustomFields:
        type: object
        description: "**Address' custom fields**"