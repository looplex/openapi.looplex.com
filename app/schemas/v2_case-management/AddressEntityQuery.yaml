title: Address
type: object
allOf:
  - $ref: ../../scim/ResourceQuery.yaml
  - type: object
    properties:
      Country:
        type: string <nullable>
        example: <pais>
        description: "**ISO 3166-1 alpha2 value (2 caracteres)**"
      PostalCode:
        type: string <nullable>
        example: <cep>
        description: "**Postal code**"
      StreetAddress:
        type: string
        example: <logradouro>
        description: "**Street**"
      StreetAddressNumber:
        type: string <nullable>
        example: <numero_do_logradouro>
        description: "**Street number**"
      Pobox:
        type: string <nullable>
        example: <caixa_postal>
        description: "**PO box**"
      Locality:
        type: string <nullable>
        example: <cidade>
        description: "**Cidade**"
      Region:
        type: string <nullable>
        example: <sigla_estado>
        description: "**State**"
      Neighborhood:
        type: string <nullable>
        example: <bairro>
        description: "**Neighborhood**"
      Complement:
        type: string
        description: "**Address' complement**"
        example: <complemento>
      Type:
        $ref: ../../enums/v2_case-management/AddressType.yaml
      Primary:
        type: boolean
        example: true
        description: "**Is this the main address?**"
      CustomFields:
        type: object
        description: "**Address' custom fields**"