title: External service provider
type: object
allOf:
  - $ref: ../../scim/ResourceQuery.yaml
  - type: object
    properties:
      Name:
        type: string
        example: <name>
        description: "**External service provider's name**"
      Phone:
        $ref: PhoneNumberEntityQuery.yaml
      Address:
        $ref: AddressEntityQuery.yaml
      Summary:
        type: string
        example: <summary>
        description: "**External service provider's summary**"
      Identities:
        type: array
        items:
          $ref: ../common/LegacyIdentityEntityQuery.yaml
      Type:
        type: string
        description: |
          **Person's type**<br />
          UNDEFINED<br/>
          NATURAL_PERSON<br />
          LEGAL_PERSON
      Emails:
        type: array
        items:
          $ref: EmailEntityQuery.yaml
      Status:
        $ref: ../../enums/v2_case-management/Status.yaml
      CustomFields:
        type: object
        example: {}
        description: "**Custom fields for this item**"