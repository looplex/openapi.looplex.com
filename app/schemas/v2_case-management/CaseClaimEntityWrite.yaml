title: Claim
type: object
properties:
  caseId:
    type: string
    format: uuid
    example: <global_unique_identifier>
    description: |
      **Case's unique identifier of this claim**<br/>
      `Obrigatório apenas quando o pedido não estiver sendo criado junto com o caso`
  subjectMatter:
    type: string
    example: <classificacao_geral_da_questao>
    description: "**Question's general classification**"
  reliefStatement:
    type: string <nullable>
    example: <relief_statement>
    description: "**Request for resolution of a dispute, stating interpretation of situation or status, or creating an obligation to pay, to do, or not to do**"
  remedyType:
    $ref: ../../enums/v2_case-management/TipoReparacao.yaml
  provisionalRelief:
    $ref: ../../enums/v2_case-management/TipoTutela.yaml
  againstPosition: 
    type: string
    example: <polo>
    description: |
      **Participant's position**<br />
      ACTIVE<br/>
      PASSIVE<br/>
      THIRD_PARTY
  participants:
    description: |
      **Participant's identifiers**<br/>
      _These participants should be binded to this case in the same position as the claim_
    type: array
    items:
      type: string
      format: uuid
      example: <global_unique_identifier>
  riskClassification:
    $ref: ../../enums/v2_case-management/ContingentLiabilityRiskClassification.yaml
  foreseenValue:
    type: number
    example: 0
    description: "**Foreseen value**"
  liquidated:
    type: boolean
    example: false
    description: "**Indicação se o valor previsto é líquido (ainda que o montante seja disputado) ou apenas uma estimativa**"
  effectiveDate:
    type: string
    format: datetime
    example: <effective_date>
    description: "**Data de constituição**"
  dueDate:
    type: string
    format: datetime
    example: <due_date>
    description: "**Data de vencimento**"
  recurrence:
    $ref: ../../enums/v2_case-management/TipoDeRecorrencia.yaml
  status:
    $ref: ../../enums/v2_case-management/ClaimStatus.yaml
  customFields:
    type: object
    description: "**Claim's custom fields**"
    example: {}
required:
  - caseId
  - subjectMatter
  - remedyType
  - againstPosition
  - recurrence
  - liquidated