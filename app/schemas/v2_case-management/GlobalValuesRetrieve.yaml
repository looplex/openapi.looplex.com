title: Valores globais do caso por polo
type: object
properties: 
  againstPosition:
    $ref: ../../enums/v2_case-management/Position.yaml
    description: "**Contra polo ativo, passivo, terceiro...**"
  perspective:
    $ref: ../../enums/v2_case-management/TipoExpectativaReivindicacao.yaml
# Removido do C# (GlobalValues não possui mais RiskClassification); mantido comentado por histórico
#  riskClassification:
#    $ref: ../../enums/v2_case-management/ContingentLiabilityRiskClassification.yaml
  currency:
    $ref: ../../enums/v2_case-management/Moeda.yaml
    description: "**Moeda usada para os valores do caso**"
  caseDeclaredValue:
    type: [number, "null"]
    description: |
      **Valor da causa**<br />
      Valor declarado na petição inicial, no contrato ou no documento que formaliza a obrigação
    example: 0
  caseForeseenValue:
    type: [number, "null"]
    description: |
      **Valor previsto**<br />
      Valor estimado para a resolução do caso, transação ou disputa
    example: 0
  caseContingencyValue:
    type: [number, "null"]
    description: |
      **Valor de contingência**<br />
      Valor de provisionamento vinculado a perspectiva e risco do caso. <br />
      Para os casos de êxito é uma estimativa do valor que poderá receber, e para os casos de perda é uma estimativa do valor que poderá pagar
    example: 0
  caseForeseenValueUpdated:
    type: [number, "null"]
    description: |
      **Valor previsto atualizado**<br />
      Valor estimado para a resolução do caso, transação ou disputa
    example: 0
  caseContingencyValueUpdated:
    type: [number, "null"]
    description: |
      **Valor de contingência atualizado**<br />
      Valor de provisionamento vinculado a perspectiva e risco do caso. <br />
      Para os casos de êxito é uma estimativa do valor que poderá receber, e para os casos de perda é uma estimativa do valor que poderá pagar
    example: 0
