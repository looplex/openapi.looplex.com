title: Additional information (Dado complementar)
type: object
allOf:
  - $ref: ../../scim/ResourceRetrieve.yaml
  - type: object
    properties:
      name:
        type: [string, "null"]
        example: <nome_do_dado_complementar>
        description: "**Nome**"
      fieldType:
        $ref: ../../enums/v2_case-management/AdditionalInformationType.yaml
      fieldSize:
        type: [integer, "null"]
        description: "**Tamanho (tipos texto)**"
      isMandatory:
        type: boolean
        description: "**Indica se o preenchimento é obrigatório**"
      status:
        type: boolean
        description: "**Indica se o dado complementar está ativo**"
      schema:
        type: [string, "null"]
        description: "**Schema JSON**"
      customFields:
        type: object
        example: {}
        description: "**Additional information's custom fields**"
      values:
        type: array
        items:
          type: string
        description: "**Opções do dropdown**"
      linkType:
        $ref: ../../enums/v2_case-management/AdditionalInformationLinkType.yaml
      client:
        $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
      clientGroups:
        type: array
        items:
          $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
        description: "**Grupos de cliente vinculados**"
      groups:
        type: array
        items:
          $ref: ../../schemas/common/SimpleEntityRetrieve.yaml
        description: "**Áreas vinculadas**"
      employees:
        type: array
        description: "**Funcionários e seus valores**<br />Somente leitura"
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: [string, "null"]
            value:
              type: [string, "null"]
      cases:
        type: array
        description: "**Processos e seus valores**<br />Somente leitura"
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: [string, "null"]
            value:
              type: [string, "null"]
      caseTypes:
        type: array
        items:
          $ref: ../../enums/common/RamosJudicial.yaml
        description: "**Tipos de processo vinculados**"
      createdBy:
        type: [string, "null"]
      updatedBy:
        type: [string, "null"]
