title: Dados de caso
type: object
properties:
  status:
    $ref: ../../enums/v2_case-management/SituacaoDoProcesso.yaml
  type:
    $ref: ../../enums/common/RamosJudicial.yaml
  subType:
    description: "**Indicação do subtipo de caso, define se ele é um caso originário ou uma continuação como um recurso, incidente ou um subcaso**"
    oneOf:
      - $ref: ../../enums/v2_case-management/ClasseProcessoContrato.yaml
      - $ref: ../../enums/v2_case-management/ClasseProcessoSocietario.yaml
      - $ref: ../../enums/v2_case-management/ClasseProcesso.yaml
    example: <classe_do_processo>
  level:
    type: integer
    example: 1
    description: "**Instância do caso**"
  identities:
    description: "**Identificação do caso, como número CNJ, NIRE, Número do contrato, ids de sistemas externos, etc**"
    type: array
    items:
      $ref: ../../schemas/common/CaseIdentityEntityWrite.yaml
  title:
    type: string
    description: "**Nome Jurídico do caso**"
    example: <titulo_do_processo>
  summary:
    type: string <nullable>
    description: "**Breve descrição sobre o caso**"
    example: <observacoes_do_processo>
  locale:
    description: |
      **Utilizado para todos os casos menos os judiciais**<br/>
      Local da Jurisdição de um caso, ou cumprimento da obrigação
    type: array
    items:
      $ref: ../../schemas/common/SimpleEntityWrite.yaml
    example: [
      {
        Name: "<country_name>"
      },
      {
        Name: "<state_name>"
      },
      {
        Name: "<city_name>"
      }
    ]
  courtVenue:
    description: |
      **Foro do caso, local onde o caso será julgado.**<br/>
      Casos de tipo: <b>judicial, administrativo e arbitragem
    oneOf:
      - type: string <nullable>
        example: <foro_do_processo>
        description: "**Foro do caso, local onde o caso será julgado**"
      - type: string
        format: uuid
        description: "**Unique identifier do Court Venue**"
  caseProcedure:
    description: |
      **Rito ou procedimento do caso**<br/>
      Casos de tipo: <b>judicial, administrativo e arbitragem
    oneOf:
      - type: string <nullable>
        example: <rito_do_processo>
        description: "**Nome do rito**"
      - type: string
        format: uuid
        description: "**Unique identifier do CaseProcedure**"
  phase:
    description: |
      **Fase do caso**<br />
      Etapas que determinam os procedimentos que devem ser seguidos para a resolução do caso
    oneOf:
      - type: string (name)
        example: <fase_do_processo>
        description: "**Nome da fase**"
      - type: string uuid (unique identifier)
        format: uuid
        description: "**Unique identifier da fase**"
  legalCategories:
    description: "**Indica os assuntos tratados no caso**"
    type: array
    items:
      oneOf:
      - type: string (name)
        example: <natureza_do_processo>
        description: "**Nome da legal category**"
      - type: string uuid (unique identifier)
        format: uuid
        description: "**Unique identifier da legal category**"
    example: []
  retentionDate:
    type: string <nullable>
    format: datetime
    description: |
      **Data de entrada** <br />
      Data em que a organização (escritório de advocacia ou departamento jurídico) foi oficialmente contratada pelo cliente para representar ou gerenciar o caso
    example: <data_de_entrada_do_processo>
  startDate:
    type: string <nullable>
    format: datetime
    description: |
      **Data de distribuição**<br />
      Data em que um caso foi distribuído para um tribunal em disputas ou data em que um contrato ou negócio jurídico foi assinado pelas partes
    example: <data_de_distribuicao_do_processo>
  formationDate:
    type: string <nullable>
    format: datetime
    description: |
      **Data de citação**<br />
      Data em que uma ação judicial ou negócio se torna ativo. Para disputas, é a data da citação. <br />
      Para contratos e atos societários, é a data em que o instrumento entra em vigor ou se torna exigível
    example: <data_de_citacao_do_processo>
  resJudicataDate:
    type: string <nullable>
    format: datetime
    description: |
      **Data de trânsito em julgado**<br />
      Data em que uma decisão se torna final e irrecorrível, tornando a sentença conclusiva e obrigatória. <br />
      A partir dessa data, o caso não pode ser reaberto ou contestado. Utilizado apenas para casos judiciais
    example: <data_transito_julgado_do_processo>
  forecastedEndDate:
    type: string <nullable>
    format: datetime
    description: |
      **Data prevista para encerramento**<br />
      Data estimada para a conclusão de um caso, transação ou disputa. <br />
      Essa data é utilizada para fins de planejamento e pode ser ajustada conforme o andamento do caso
    example: <data_prevista_encerramento_do_processo>
  group:
    description: |
      **Área**<br/>
      Grupo ou área do escritório de advocacia ou departamento jurídico responsável pelo caso
    oneOf:
      - type: string (name)
        example: <area_do_processo>
        description: "**Nome da área**"
      - type: string uuid (unique identifier)
        format: uuid
        description: "**Unique identifier da área**"
  product:
    description: |
      **Produto**<br />
      Produto ou serviço do cliente que está relacionado ao caso
    type: array
    items:
      oneOf:
      - type: string (name)
        example: <produto_do_processo>
        description: "**Nome do product**"
      - type: string uuid (unique identifier)
        format: uuid
        description: "**Unique identifier do product**"
    example: []
  caseClient:
    $ref: ../../schemas/common/SimpleEntityWrite.yaml
    description: |
      **Cliente**<br />
      Qualquer pessoa ou entidade que contrata ou retém uma equipe jurídica para gerenciar ou conduzir atividades em um caso em seu nome
  legalServiceAgreement:
    $ref: ../../schemas/common/SimpleEntityWrite.yaml
    description: |
      **Contrato**<br />
      Contrato de prestação de serviços jurídicos que rege a relação entre o escritório de advocacia ou departamento jurídico e o cliente<br/>
      `Obrigatório quando o cliente não tem um contrato default definido`
  owner:
    $ref: ../../schemas/common/SimpleEntityWrite.yaml
    description: |
      **Responsável**<br />
      Advogado ou membro da equipe jurídica responsável pelo caso
  coowners:
    type: array
    items:
      $ref: ../../schemas/common/SimpleEntityWrite.yaml
    description: |
      **Corresponsáveis**<br />
      Advogados ou membros da equipe jurídica que compartilham a responsabilidade pelo caso
  externalServiceProvider:
    $ref: ../../schemas/common/SimpleEntityWrite.yaml
    description: |
      **Escritório Responsável / Correspondente**<br />
      Prestador de serviços externo contratado para fornecer serviços jurídicos em um caso
  participants:
    type: array
    items:
      oneOf:
        - $ref: ParticipantNaturalPersonWrite.yaml
        - $ref: ParticipantLegalPersonWrite.yaml
    description: "**Quaisquer pessoas envolvidas em um caso, incluindo não apenas as partes, mas também outros interessados, como testemunhas, representantes legais, ou quaisquer outros que desempenhem um papel**"
  globalValues:
    type: array
    items:
      $ref: GlobalValuesWrite.yaml
  entries:
    type: array
    items:
      $ref: EntryEntityWrite.yaml
    description: "**Registro de andamentos do caso, criados por usuários ou automaticamente através de integrações**"
  claims:
    type: array
    items:
      $ref: CaseClaimEntityWrite.yaml
    description: "**Case claims**"
  customFields:
    type: object
    example: {}
    description: "**Case's custom fields**"
  parentCase:
    description: "**The parent case of this case**"
    oneOf:
      - type: string
        example: <numero_cnj_do_processo_ou_global_unique_identifier>
        description: "**Numero CNJ do caso**"
      - type: string
        format: uuid
        description: "**Identificador único do caso**"
      - type: object
        description: "**Os dados do caso para cadastro**"
required:
  - status
  - type
  - subType
  - title
  - group
  - owner
  - caseClient
  - legalServiceAgreement