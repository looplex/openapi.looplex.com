title: Address
type: object
properties:
  country:
    type: object
    description: "**ISO 3166-1 alpha2 value (2 caracteres)**"
    properties:
      id:
        type: string
        format: uuid
        description: "**The item unique identifier**"
        example: <global_unique_identifier>
      name:
        type: [string, "null"]
        description: "**The item name**"
        example: <nome_do_item>
  postalCode:
    type: [string, "null"]
    example: <cep>
    description: "**Postal code**"
  streetAddress:
    type: string
    example: <logradouro>
    description: "**Street**"
  streetAddressNumber:
    type: [string, "null"]
    example: <numero_do_logradouro>
    description: "**Street number**"
  locality:
    type: object
    description: "**Cidade**"
    properties:
      id:
        type: string
        format: uuid
        description: "**The item unique identifier**"
        example: <global_unique_identifier>
      name:
        type: [string, "null"]
        description: "**The item name**"
        example: <nome_do_item>
  region:
    type: object
    description: "**State**"
    properties:
      id:
        type: string
        format: uuid
        description: "**The item unique identifier**"
        example: <global_unique_identifier>
      name:
        type: [string, "null"]
        description: "**The item name**"
        example: <nome_do_item>
  extendedAddress:
    type: string
    description: "**Extended address**"
    example: <complemento>
  type:
    $ref: ../../enums/v2_case-management/AddressType.yaml
  primary:
    type: boolean
    example: false
    description: "**Is this the main address?**"
  customFields:
    type: object
    description: "**Address' custom fields**"
required:
  - streetAddress