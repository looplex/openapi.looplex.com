title: Dados de andamento
type: object
allOf:
  - $ref: ../../scim/ResourceQuery.yaml
  - type: object
    properties:
      Date:
        type: string
        format: datetime
        example: <data_do_andamento>
        description: "**Data do andamento**"
      Classification:
        type: string <nullable>
        description: "**Classificação do andamento**"
        example: <classificacao_do_andamento>
      Description:
        type: string
        example: <descricao_do_andamento>
        description: "**Texto do andamento**"
      IsInternal:
        type: boolean
        example: false
        description: "**Indica se o andamento é de uso interno**"
      ServiceOfProcess:
        type: string <nullable>
        format: uuid
        description: "**Identificador da publicação que criou esse andamento (se houver)**"
        example: <unique_identifier_da_publicacao>
      CreatedAt:
        type: string
        format: datetime
        example: <data_criacao_do_andamento>
        description: "**Entry creation date**"
      CreatedBy:
        $ref: ../../schemas/common/SimpleEntityQuery.yaml
      ClassificationType:
        $ref: ../../enums/v2_case-management/TipoClassificacaoAutomatica.yaml
      CaseId:
        type: string
        format: uuid
        description: "**Case's unique identifier**"
        example: <unique_identifier_do_processo>
      CustomFields:
        type: object
        example: {}
        description: "**Entry's custom fields**"
      Identities:
        type: array
        items:
          $ref: ../../schemas/common/LegacyIdentityEntityQuery.yaml