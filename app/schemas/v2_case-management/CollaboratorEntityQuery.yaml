title: Collaborator
type: object
allOf:
  - $ref: ../../scim/ResourceQuery.yaml
  - type: object
    properties:
      CategoryId:
        type: string
        format: uuid
        description: "**Category's unique identifier**"
      Name:
        type: string
        description: "**Collaborator's name**"
        example: <nome>
      NickName:
        type: [string, "null"]
        description: "**Collaborator's nickname**"
        example: <apelido>
      Dob:
        type: [string, "null"]
        format: date-time
        description: "**Collaborator's date of birth**"
        example: <data_de_nascimento>
      AdmissionDate:
        type: [string, "null"]
        format: date-time
        description: "**Collaborator's admission date**"
        example: <data_de_admissao>
      DemissionDate:
        type: [string, "null"]
        format: date-time
        description: "**Collaborator's demission date**"
        example: <data_de_demissao>
      Gender:
        $ref: ../../enums/v2_case-management/Gender.yaml
      Identities:
        type: array
        items:
          $ref: ../../schemas/common/NaturalPersonIdentityEntityQuery.yaml
        description: "**Collaborator's identities**"
      Nationality:
        type: [string, "null"]
        description: "**Collaborator's nationality**"
        example: <nacionalidade>
      MaritalStatus:
        $ref: ../../enums/v2_case-management/MaritalStatus.yaml
      Occupation:
        type: [string, "null"]
        description: "**Collaborator's occupation**"
        example: <profissao>
      Role:
        $ref: ../../enums/v2_case-management/VinculoEmpregaticio.yaml
      Status:
        $ref: ../../enums/v2_case-management/BooleanStatus.yaml
      Addresses:
        type: array
        items:
          $ref: AddressEntityQuery.yaml
        description: "**Collaborator's addresses**"
      Emails:
        type: array
        items:
          $ref: EmailEntityQuery.yaml
        description: "**Collaborator's emails**"
      PhoneNumbers:
        type: array
        items:
          $ref: PhoneNumberEntityQuery.yaml
        description: "**Collaborator's phone numbers**"
      CustomFields:
        type: object
        description: "**Collaborator's custom fields**"