title: Phone number
type: object
properties:
  value:
    type: string
    description: |
      **Phone number**<br />
      Normalizado antes da validação (sem máscara e sem zero à esquerda do DDD). Tamanho (com DDD): `home`, `work` e `fax` de 8 a 10 dígitos; `mobile` e `pager` de 9 a 11 dígitos; `other` sem validação de tamanho
    example: <numero_do_telefone>
  type:
    $ref: ../../enums/v2_case-management/TipoDeTelefone.yaml
  primary:
    type: boolean
    description: |
      **A Boolean value indicating the 'primary' or preferred attribute value for this attribute, e.g., the preferred phone number or primary phone number**<br />
      The primary attribute value 'true' MUST appear no more than once.
    example: true
  context:
    type: [string, "null"]
    description: "**Indicates whether the phone belongs to a client, employee, etc.**"
    example: <contexto>
  contextId:
    type: [string, "null"]
    format: uuid
    description: "**Identifier of the owner (client, employee, etc.) of this phone**"
    example: <global_unique_identifier>
  contact:
    type: string
    description: "**Contact name**"
    example: <contato>
  extension:
    type: string
    description: "**Phone's extension**"
    example: <extensao>
  countryCode:
    type: integer
    description: "**Phone's country code**"
    example: <codigo_do_pais>
  customFields:
    type: object
    description: "**Phone's custom fields**"
required: 
  - value
  - type
  - primary