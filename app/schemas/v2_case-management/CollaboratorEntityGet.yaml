title: Collaborator
type: object
allOf:
  - $ref: ../../scim/ResourceGet.yaml
  - type: object
    properties:
      categoryId:
        type: string
        format: uuid
        description: "**Category's unique identifier**"
      name:
        type: string
        description: "**Collaborator's name**"
        example: <nome>
      nickName:
        type: [string, "null"]
        description: "**Collaborator's nickname**"
        example: <apelido>
      dob:
        type: [string, "null"]
        format: date-time
        description: "**Collaborator's date of birth**"
        example: <data_de_nascimento>
      admissionDate:
        type: [string, "null"]
        format: date-time
        description: "**Collaborator's admission date**"
        example: <data_de_admissao>
      demissionDate:
        type: [string, "null"]
        format: date-time
        description: "**Collaborator's demission date**"
        example: <data_de_demissao>
      gender:
        $ref: ../../enums/v2_case-management/Gender.yaml
      identities:
        type: array
        items:
          $ref: ../common/NaturalPersonIdentityEntityGet.yaml
        description: "**Collaborator's identities**"
      nationality:
        type: [string, "null"]
        description: "**Collaborator's nationality**"
        example: <nacionalidade>
      maritalStatus:
        $ref: ../../enums/v2_case-management/MaritalStatus.yaml
      occupation:
        type: [string, "null"]
        description: "**Collaborator's occupation**"
        example: <profissao>
      role:
        $ref: ../../enums/v2_case-management/VinculoEmpregaticio.yaml
      status:
        $ref: ../../enums/v2_case-management/BooleanStatus.yaml
      externalServiceProviderId:
        type: [string, "null"]
        format: uuid
        description: "**Unique identifier of the external service provider the collaborator works for**; `null` when not linked to one"
      companyId:
        type: [string, "null"]
        format: uuid
        description: "**Unique identifier of the company the collaborator works for**; `null` when not linked to one"
      affiliation:
        type: object
        description: |
          **Who the collaborator works for** (read-only, always returned)<br/>
          The external service provider, the company (name, CNPJ and e-mail of its branch) or, when the collaborator has no link, the law office itself, whose `id` is `null`.
        properties:
          id:
            type: [string, "null"]
            format: uuid
            description: "**Provider's or company's unique identifier**; `null` for the law office"
          name:
            type: [string, "null"]
            description: "**Name**"
            example: <nome>
          document:
            type: [string, "null"]
            description: "**CPF or CNPJ**"
            example: <cpf_ou_cnpj>
          email:
            type: [string, "null"]
            description: "**E-mail**"
            example: <email>
      addresses:
        type: array
        items:
          $ref: AddressEntityGet.yaml
        description: "**Collaborator's addresses**"
      emails:
        type: array
        items:
          $ref: EmailEntityGet.yaml
        description: "**Collaborator's emails**"
      phoneNumbers:
        type: array
        items:
          $ref: PhoneNumberEntityGet.yaml
        description: "**Collaborator's phone numbers**"
      customFields:
        type: object
        description: "**Collaborator's custom fields**"