title: Entry (Andamento)
type: object
properties:
  date:
    type: string
    format: date-time
    example: <data_do_andamento>
    description: "**Data do andamento**"
  classification:
    type: [string, "null"]
    description: "**Classificação do andamento**"
    example: <classificacao_do_andamento>
  description:
    type: string
    example: <texto_do_andamento>
    description: "**Texto do andamento**"
  isInternal:
    type: boolean
    example: false
    description: "**Indica se o andamento é de uso interno**"
  createdBy:
    description: |
      **Autor do andamento**<br />
      Somente `id` é considerado (o `name` é ignorado). Sem `id`, o autor é o funcionário ativo cujo e-mail é o do usuário logado. Funcionário inexistente ou demitido retorna o erro `Author was not found`
    $ref: ../../schemas/common/SimpleEntityWrite.yaml
  classificationType:
    $ref: ../../enums/v2_case-management/TipoClassificacaoAutomatica.yaml
  caseId:
    type: string
    format: uuid
    example: <global_unique_identifier>
    description: |
      **Case's unique identifier**<br/>
      `Obrigatório apenas quando o andamento não estiver sendo criado junto com o caso`
  customFields:
    type: object
    example: {}
    description: "**Entry's custom fields**"