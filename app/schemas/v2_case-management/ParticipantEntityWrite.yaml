title: Dados de Parte
type: object
properties:
  ClientId:
    type: string
    format: uuid
    example: <client_uuid>
    description: |
      **Client's unique identifier**<br/>
      This property if filled if the participant is a client
  EmployeeId:
    type: string
    format: uuid
    example: <employee_uuid>
    description: |
      **Employee's unique identifier**<br/>
      This property if filled if the participant is an employee
  CaseId:
    type: string
    format: uuid
    example: <case_uuid>
    description: |
      **The participant's case**
  CreatedBy:
    $ref: ../../schemas/common/SimpleEntityQuery.yaml
  Name:
    type: string
    example: <nome_da_parte>
    description: "**Participant's name**"
  Nickname:
    type: [string, "null"]
    example: <apelido_da_parte>
    description: "**Apelido**"
  IsMainParty:
    type: boolean
    example: <is_main_party>
    description: |
      **Indicate if this participant is the main party in this case**
  Represents:
    type: array
    items:
      type: string
    example: ["document", "uuid"]
    description: |
      **Documents or uuids of parties represented by this participant (if this participant is a lawyer)**
  LawyerOffice:
    type: [string, "null"]
    description: "**Escritório do advogado (se houver)**"
    example: <escritorio>
  Nature:
    example: NATURAL_PERSON
    $ref: ../../enums/v2_case-management/TipoPessoa.yaml
  Position:
    example: ACTIVE
    $ref: ../../enums/v2_case-management/Position.yaml
  Addresses:
    description: "**Participant's addresses**"
    type: array
    items:
      $ref: AddressEntityWrite.yaml
  Emails:
    description: "**E-mails**"
    type: array
    items:
      $ref: EmailEntityWrite.yaml
  Identities:
    description: "**Participant's identities**"
    type: array
    items:
      oneOf:
        - $ref: ../../schemas/common/NaturalPersonIdentityEntityWrite.yaml
        - $ref: ../../schemas/common/LegalPersonIdentityEntityWrite.yaml
  PhoneNumbers:
    description: "**Telefones**"
    type: array
    items:
      $ref: PhoneNumberEntityWrite.yaml
  Role:
    $ref: ../../enums/v2_case-management/ParticipantRole.yaml
  CustomFields:
    type: object
    example: {}
    description: "**Participant's custom fields**"  
  BusinessStructure:
    type: string
  Dob:
    type: string
    format: datetime
    description: |
      **Date of birth (NATURAL_PERSON only)**
  Gender:
    $ref: ../../enums/v2_case-management/Gender.yaml
    description: |
      **Gender (NATURAL_PERSON only)**
  Nationality:
    type: string
  MaritalStatus:
    $ref: ../../enums/v2_case-management/MaritalStatus.yaml
  Occupation:
    type: string
required:
  - Nature
  - Name
  - CaseId