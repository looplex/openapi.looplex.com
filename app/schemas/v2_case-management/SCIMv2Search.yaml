title: SCIMv2Search
description: "Model for SCIM v2 /.search endpoint filter"
properties:
  schemas:
    type: array
    description: "**The array of URNs**"
    items:
      type: string
    example: ["urn:ietf:params:scim:api:messages:2.0:SearchRequest"]
  filter:
    type: string
    example: null
    description: "**The SCIMv2 filter**"
  sortBy:
    type: string
    example: null
    description: "**The property for sorting results**"
  sortOrder:
    type: string
    example: null
    description: "**The sort order (ASC / DESC)**"
  startIndex:
    type: integer
    example: 1
    description: "**The start index for pagination**"
  count:
    type: integer
    example: 10
    description: "**The total count of items to return**"
required:
  - schemas