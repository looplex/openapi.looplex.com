tags:
  - ActivityCodes
summary: "/ActivityCodes"
description: "**Fetch items paginated**"
operationId: ActivityCodes-get
parameters:
  - $ref: ../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../parameters/scim/StartIndex.yaml
  - $ref: ../parameters/scim/Count.yaml
  - $ref: ../parameters/scim/Filter.yaml
  - name: Id
    description: "Pode ser passado vários Ids separados por vírgula"
    in: query
    schema:
      type: string
      format: uuid
  - name: Name
    in: query
    schema:
      type: string
  - name: Code
    in: query
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../schemas/common/ListResponse.yaml
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../schemas/v2_activity_task_codes/ActivityCodeEntityQuery.yaml
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../scim/SCIMError.yaml