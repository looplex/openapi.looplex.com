    example: [1,2,3]
    description: "**The item's unique identifiers**"
    schema:
      type: array
      items:
        type: integer
  - $ref: ../parameters/Page.yaml
  - $ref: ../parameters/PerPage.yaml
  - $ref: ../parameters/ResponseFormat.yaml
responses:
