    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Foro_v2_1.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  resources:
                    type: array
                    items:
                      $ref: ../schemas/Foro_v2_1.yaml