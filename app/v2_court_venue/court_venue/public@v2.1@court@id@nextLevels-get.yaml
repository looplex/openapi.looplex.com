tags:
  - Court Venue
summary: "Next levels"
description: "List next levels after this node level"
operationId: v2.1-court-id-nextLevels-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: id
    in: path
    required: true
    description: "**The item's identifier**"
    schema:
      type: integer
  - name: quantityLevels
    in: query
    required: false
    description: "**The level quantity to search** `(default: 2)`"
    schema:
      type: integer
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Foro_v2_1.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  resources:
                    type: array
                    items:
                      $ref: ../schemas/Foro_v2_1.yaml