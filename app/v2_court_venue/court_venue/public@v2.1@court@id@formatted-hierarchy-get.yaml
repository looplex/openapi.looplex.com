tags:
  - Court Venue
summary: "Formatted hierarchy"
description: "Get the formatted hierarchy from this node"
operationId: v2.1-court-id-formatted-hierarchy-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../parameters/ResponseFormat.yaml
  - name: id
    in: path
    required: true
    description: "**The item's identifier**"
    schema:
      type: integer
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../../schemas/v2_court_venue/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: object
                    properties:
                      hierarquiaCompleta:
                        type: string
                        description: "A hierarquia completa do item"
                      hierarquiaFormatada:
                        type: string
                        description: "A hierarquia formatada do item"
            - allOf:
              - properties:
                  hierarquiaCompleta:
                    type: string
                    description: "A hierarquia completa do item"
                  hierarquiaFormatada:
                    type: string
                    description: "A hierarquia formatada do item"