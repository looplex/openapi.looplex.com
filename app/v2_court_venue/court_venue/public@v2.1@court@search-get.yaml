tags:
  - Court Venue
summary: "Paginated search of court venue"
operationId: v2.1-court-search-get
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - name: filter
    in: query
    required: true
    description: "**The term to search**"
    schema:
      type: string
  - $ref: ../parameters/Page.yaml
  - $ref: ../parameters/PerPage.yaml
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../../schemas/v2_court_venue/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../../schemas/v2_court_venue/Foro_v2_1.yaml
            - allOf:
              - $ref: ../../schemas/common/ListResponse.yaml
              - properties:
                  resources:
                    type: array
                    items:
                      $ref: ../../schemas/v2_court_venue/Foro_v2_1.yaml