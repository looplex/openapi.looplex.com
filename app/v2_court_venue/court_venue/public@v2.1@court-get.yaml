tags:
  - Court Venue
summary: "Paginated list of court venue by level"
operationId: court_venue-by-level-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: level
    in: query
    required: true
    description: "**The level of the item lo list**"
    schema:
      type: integer
  - $ref: ../parameters/Page.yaml
  - $ref: ../parameters/PerPage.yaml
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  Resources:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml