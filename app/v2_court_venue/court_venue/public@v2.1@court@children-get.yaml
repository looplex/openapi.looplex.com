tags:
  - Court Venue
summary: "Paginated list of court venue by parent name"
description: "List items according to parent name"
operationId: v2.1-court-children-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: parentName
    in: query
    required: true
    description: "**The item's name to list the children**"
    schema:
      type: string
  - $ref: ../parameters/Page.yaml
  - $ref: ../parameters/PerPage.yaml
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../../schemas/v2_court_venue/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../../schemas/v2_court_venue/Foro_v2_1.yaml
            - allOf:
              - $ref: ../../schemas/common/ListResponse.yaml
              - properties:
                  resources:
                    type: array
                    items:
                      $ref: ../../schemas/v2_court_venue/Foro_v2_1.yaml