tags:
  - Tags
summary: "/tags/:tag_id"
description: |
  **Retrieve information about a tag**
operationId: tags-tag_id-get
parameters:
  - $ref: ../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../common_parameters/Tenant.yaml
  - $ref: ../common_parameters/BearerToken.yaml
  - name: tag_id
    in: path
    required: true
    description: |
      **The item's unique identifier**
    schema:
      type: string
      format: uuid
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ./schemas/Tag.yaml
  "500":
      description: "Internal Server Error"