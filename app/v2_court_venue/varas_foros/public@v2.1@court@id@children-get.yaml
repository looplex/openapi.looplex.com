tags:
  - Varas e Foros
summary: "Paginated list of court venue by parent identifier"
description: "List items according to parent identifier"
operationId: court-id-children-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: id
    in: path
    required: true
    description: "**The parent item's identifier**"
    schema:
      type: int
  - $ref: ../parameters/Page.yaml
  - $ref: ../parameters/PerPage.yaml
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  Resources:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml