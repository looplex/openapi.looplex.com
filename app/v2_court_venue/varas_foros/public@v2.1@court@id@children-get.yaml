tags:
  - Varas e Foros
summary: "Pesquisa de varas e foros"
description: "Lista os itens de acordo com o identificador do pai"
operationId: varas_foros-court-id-children-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: id
    in: path
    required: true
    description: "**The item's unique identifier**"
    schema:
      type: string
  - $ref: ../parameters/Page.yaml
  - $ref: ../parameters/PerPage.yaml
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  Resources:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml