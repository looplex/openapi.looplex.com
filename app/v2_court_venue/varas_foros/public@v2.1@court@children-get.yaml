tags:
  - Varas e Foros
summary: "Paginated list of court venue by parent name"
description: "List items according to parent name"
operationId: court-children-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: parentName
    in: query
    required: true
    description: "**The item's name to list the children**"
    schema:
      type: string
  - $ref: ../parameters/Page.yaml
  - $ref: ../parameters/PerPage.yaml
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  Resources:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml