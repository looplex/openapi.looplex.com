tags:
  - Varas e Foros
summary: "Listagem de varas e foros por identificadores"
operationId: varas_foros-court-list-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: ids
    in: query
    required: true
    example: [1,2,3]
    description: "**The item's unique identifiers**"
    schema:
      type: array
      items:
        type: integer
  - name: page
    in: query
    required: false
    description: "**The page to search**. `(default: 1)`"
    schema:
      type: integer
  - name: perPage
    in: query
    required: false
    description: "**The page to search**. `(default: 10)`"
    schema:
      type: integer
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  Resources:
                    type: array
                    items:
                      $ref: ../schemas/Foro.yaml