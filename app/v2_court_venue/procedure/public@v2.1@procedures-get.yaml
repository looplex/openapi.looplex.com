tags:
  - Procedure
summary: "List procedures by filters"
description: "**List procedures by filters**"
operationId: v2.1-procedures-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../parameters/ResponseFormat.yaml
  - name: nodeUuid
    in: query
    required: false
    description: "**The node unique identifier to list the procedures**"
    schema:
      type: string
      format: uuid
  - name: nodeId
    in: query
    required: false
    description: "**The node identifier to list the procedures**"
    schema:
      type: integer
  - name: procedureId
    in: query
    required: false
    description: "**The procedure identifier**"
    schema:
      type: integer
  - name: procedureName
    in: query
    required: false
    description: "**The procedure name to search**"
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      type: object
                      properties:
                        group:
                          type: string
                          description: "**The group name**"
                        groupId:
                          type: integer
                          description: "**The group id**"
                        children:
                          type: array
                          items:
                            type: object
                            properties:
                              subGroup:
                                type: string
                                description: "**The subGroup name**"
                              children:
                                type: array
                                items:
                                  $ref: ../schemas/Procedure_v2_1.yaml
            - allOf:
              - $ref: ../../schemas/common/ListResponse.yaml
              - properties:
                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        group:
                          type: string
                          description: "**The group name**"
                        groupId:
                          type: integer
                          description: "**The group id**"
                        children:
                          type: array
                          items:
                            type: object
                            properties:
                              subGroup:
                                type: string
                                description: "**The subGroup name**"
                              children:
                                type: array
                                items:
                                  $ref: ../schemas/Procedure_v2_1.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'
 