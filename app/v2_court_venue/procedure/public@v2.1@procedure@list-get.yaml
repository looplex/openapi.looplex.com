tags:
  - Procedure
summary: "List procedures by ids"
description: "**List procedures by ids**"
operationId: v2.1-procedure-list-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: ids
    in: query
    required: true
    example: [1,2,3]
    description: "**The item's identifiers**"
    schema:
      type: array
      items:
        type: integer
  - $ref: ../parameters/Page.yaml
  - $ref: ../parameters/PerPage.yaml
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Rito.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  Resources:
                    type: array
                    items:
                      $ref: ../schemas/Rito.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'
 