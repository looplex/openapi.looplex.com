tags:
  - Procedure
summary: "Procedures search"
description: "**Search procedures by filter**"
operationId: v2.1-sequence-search-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: filter
    in: query
    required: true
    description: "**The term to search**"
    schema:
      type: string
  - $ref: ../parameters/Page.yaml
  - $ref: ../parameters/PerPage.yaml
  - $ref: ../parameters/ResponseFormat.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Rito.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  Resources:
                    type: array
                    items:
                      $ref: ../schemas/Rito.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'
 