tags:
  - Procedure
summary: "List procedures by court venue node"
description: "**List procedures by court venue node**"
operationId: v2.1-node-procedures-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../parameters/ResponseFormat.yaml
  - name: node
    in: path
    required: true
    description: "**The node unique identifier to list the procedures**"
    schema:
      type: string
      format: uuid
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          oneOf:
            - allOf:
              - $ref: ../schemas/ListResponseLegacy.yaml
              - properties:
                  conteudo:
                    type: array
                    items:
                      $ref: ../schemas/Procedure_v2_1.yaml
            - allOf:
              - $ref: ../../common_schemas/ListResponse.yaml
              - properties:
                  Resources:
                    type: array
                    items:
                      $ref: ../schemas/Procedure_v2_1.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'
 