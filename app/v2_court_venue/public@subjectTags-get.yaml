tags:
  - Tags
summary: "/subjectTags"
description: |
  **Get all tag groups**
operationId: subjectTags-get
parameters:
  - $ref: ../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../common_parameters/BearerToken.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../common_schemas/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ./schemas/TagGroup.yaml
  "500":
    description: "Internal Server Error"