tags:
  - Cases
summary: "Delete Case"
operationId: Cases-delete
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - name: usesLooplexId
    in: header
    description: if true uses looplex case guid else M-files guid
    schema:
      type: boolean
  - name: id
    in: path
    required: true
    description: "**The item's unique identifier**"
    schema:
      type: string
      format: uuid
responses:
  "204":
    description: "No Content"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"