tags:
  - Cases
summary: "Update Case"
operationId: Cases-patch
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - name: id
    in: path
    required: true
    description: "**The item's unique identifier**"
    schema:
      type: string
      format: uuid
  - name: usesLooplexId
    in: header
    description: if true uses looplex case guid else M-files guid
    schema:
      type: boolean
requestBody:
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: ../../schemas/common/PatchEntity.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: boolean
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"