  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - name: id
    in: path
    required: true
    description: "**The item's unique identifier**"
    schema:
      type: string
      format: uuid
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: "../schemas/Document.yaml"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "500":
    description: "Internal Server Error"