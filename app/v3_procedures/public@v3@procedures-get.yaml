summary: "Procedures by filter"
description: |
  **Procedures by filter**<br/>
  `At least one of these parameters are required: nodeId, procedureId or procedureName`
operationId: v3-procedures-get
parameters:
  - $ref: ../parameters/common/OcpApimSubscriptionKey.yaml
  - name: nodeId
    in: query
    required: false
    description: "**The court venue identifier**"
    schema:
      type: string
      format: uuid
  - name: procedureId
    in: query
    required: false
    description: "**The procedure identifier**"
    schema:
      type: string
      format: uuid
  - name: procedureName
    in: query
    required: false
    description: "**The procedure name**"
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../schemas/common/ProcedureV3.yaml
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../scim/SCIMError.yaml