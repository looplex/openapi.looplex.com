tags:
  - TaskCodes

summary: "/TaskCodes"

description: "**Fetch items paginated**"

operationId: TaskCodes-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../schemas/common/StartIndex.yaml
  - $ref: ../../schemas/common/Count.yaml
  - $ref: ../../schemas/common/Filter.yaml  

  - name: Id
    description: "Pode ser passado vários Ids separados por vírgula"
    in: query    
    schema:
      type: string
      format: uuid
  - name: Name
    in: query    
    schema:
      type: string    


responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../common_schemas/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../schemas/task_code/TaskCodeEntityQuery.yaml  
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'