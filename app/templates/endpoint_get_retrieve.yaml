tags:
  - {{TAG_NAME}}

summary: "/{{TAG_NAME}}s/:id"
# summary: {{TITLE}}

description: "**Retrieve a {{TAG_NAME}} by id**"
# description: "{{DESCRIPTION}}"

operationId: {{OPERATION_ID}}

# query / path parameters
parameters:
  # quando o endpoint está dentro de uma pasta
  - $ref: ../../..{{PATH_PARAMETERS}}/OcpApimSubscriptionKey.yaml
  - $ref: ../../..{{PATH_PARAMETERS}}/Tenant.yaml
  - $ref: ../../..{{PATH_PARAMETERS}}/BearerToken.yaml
  - $ref: ../../..{{PATH_PARAMETERS}}/Id.yaml

  # quando o endpoint está fora de uma pasta
  - $ref: ../..{{PATH_PARAMETERS}}/OcpApimSubscriptionKey.yaml
  - $ref: ../..{{PATH_PARAMETERS}}/Tenant.yaml
  - $ref: ../..{{PATH_PARAMETERS}}/BearerToken.yaml
  - $ref: ../..{{PATH_PARAMETERS}}/Id.yaml

  # demais parametros
{{PATH_QUERY_PARAMETERS}}

# http responses
responses:
  {{HTTP_RESPONSES}}
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'