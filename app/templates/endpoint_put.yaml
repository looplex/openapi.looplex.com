tags:
  - {{TAG_NAME}}

summary: "/{{TAG_NAME}}s"
# summary: {{TITLE}}

description: "**Put {{TAG_NAME}}**"
# description: "{{DESCRIPTION}}"

operationId: {{OPERATION_ID}}

# query / path parameters
parameters:
  # quando o endpoint está dentro de uma pasta
  - $ref: ../../..{{PATH_PARAMETERS}}/OcpApimSubscriptionKey.yaml
  - $ref: ../../..{{PATH_PARAMETERS}}/Tenant.yaml
  - $ref: ../../..{{PATH_PARAMETERS}}/BearerToken.yaml

  # quando o endpoint está fora de uma pasta
  - $ref: ../..{{PATH_PARAMETERS}}/OcpApimSubscriptionKey.yaml
  - $ref: ../..{{PATH_PARAMETERS}}/Tenant.yaml
  - $ref: ../..{{PATH_PARAMETERS}}/BearerToken.yaml

  # demais parametros
  - name: id
    in: path
    required: true
    description: "**The item's unique identifier**"
    schema:
      type: string
      format: uuid

# request body
{{REQUEST_BODY}}

# http responses
responses:
  {{HTTP_RESPONSES}}
  "204":
    description: "No Content"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'