tags:
  - {{TAG_NAME}}

summary: "/{{TAG_NAME}}/:{{TAG_NAME}}_id"
# summary: {{TITLE}}

description: "**Patch {{TAG_NAME}}**"
# description: {{DESCRIPTION}}

operationId: {{OPERATION_ID}}
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../{{PATH_PARAMETERS}}/Tenant.yaml
  - $ref: ../../{{PATH_PARAMETERS}}/BearerToken.yaml
  - name: id
    in: path
    required: true
    description: "**The item's unique identifier**"
    schema:
      type: string
      format: uuid
requestBody:
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: ../common_schemas/PatchEntity.yaml
responses:
  # {{HTTP_RESPONSES}}
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: boolean
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"