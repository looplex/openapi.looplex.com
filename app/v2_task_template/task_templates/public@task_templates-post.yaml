tags:
  - Task Templates

summary: "/TaskTemplates"

description: |
  **Create task templates**<br />
  Item created's guid is returned in **Location header**

operationId: task_templates-post
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
requestBody:
  content:
    application/json:
      schema:
        $ref: ../../../app/v2_task_template/schemas/TaskTemplateEntityWrite.yaml
responses:
  "201":
    description: "Created"  
  "400":
    description: "Bad Request"  
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'
