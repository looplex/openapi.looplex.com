tags:
  - Task Templates

# escolha um titulo
# summary: "/{{TAG_NAME}}"
summary: Task Template

# escolha uma description
description: "**Fetch items paginated**"
# description: "{{DESCRIPTION}}"

operationId: {{OPERATION_ID}}
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - $ref: ../../common_parameters/StartIndex.yaml
  - $ref: ../../common_parameters/Count.yaml
  - $ref: ../../common_parameters/Filter.yaml

responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../common_schemas/ListResponse.yaml'
            - type: object
              properties:
                Resources:
                  type: array
                  items:
                    $ref: ../schemas/TaskTemplateEntity.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'