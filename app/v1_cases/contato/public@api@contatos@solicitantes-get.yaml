tags: 
  - Contato
summary: "Lista os solicitantes do cliente"
operationId: api-contatos-solicitantes
parameters:
  - $ref: ../parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: codCliente
    in: query
    required: true
    description: "O identificador do cliente"
    schema:
      type: integer
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema: 
          type: array
          items:
            $ref: ../schemas/DTOSolicitante.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml