tags: 
  - Contato
summary: "Obtém informações do contato"
operationId: api-contatos-id
parameters:
  - $ref: ../../parameters/common/Profile.yaml
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - name: IDContato
    in: path
    required: true
    description: "O identificador do contato"
    schema:
      type: integer
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema: 
          $ref: ../../schemas/v1_cases/DTOContato.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml