# Linhas com # são comentários e podem ser removidas.
tags:
  - Informações adicionais (valor)
summary: "Incluir valor em processo utilizando informação adicional"
description: "Inclui valores em processos utilizando Informação adicional."
operationId: api-dado_complementar-valor
# Parâmetros da requisição
parameters:
  - $ref: ../parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
requestBody:
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: ../schemas/DTOValorDadoComplementarCaso.yaml
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        example: "Os valores foram incluídos corretamente."
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml