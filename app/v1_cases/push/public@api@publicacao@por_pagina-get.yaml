# Linhas com # são comentários e podem ser removidas.
tags:
  - Push
summary: "Listagem de publicações paginada"
operationId: api-publicacao-por_pagina-get
# Parâmetros da requisição
parameters:
  - $ref: ../../parameters/common/Profile.yaml
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - name: currentPage
    in: query
    description: "A página atual da leitura"
    required: true
    schema:
      type: integer
  - name: pageSize
    in: query
    description: "A quantidade de itens por página"
    required: true
    schema:
      type: integer
  - name: filterType
    in: query
    required: true
    schema:
      $ref: ../../enums/v1_cases/TipoPesquisaPublicacao.yaml
  - name: startDate
    in: query
    description: "A data inicial para pesquisa"
    required: true
    schema:
      type: string
  - name: endDate
    in: query
    description: "A data final para pesquisa"
    required: true
    schema:
      type: string
  - name: bind
    in: query
    required: false
    example: "1. `Default: 2`(Todas)"
    schema:
      $ref: ../../enums/v1_cases/SituacaoPublicacao.yaml
  - name: status
    in: query
    required: false
    example: "[2,3]. `Default: [1,2,3]`"
    schema:
      $ref: ../../enums/v1_cases/StatusDaPublicacao.yaml
  - name: areaID
    in: query
    description: "O identificador da área"
    example: 10
    required: false
    schema:
      type: integer
  - name: responsibleIDs
    in: query
    description: "Os identificadores dos responsáveis dos casos"
    example: [1,2]
    required: false
    schema:
      type: array
      items:
        type: integer
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: object
          properties:
            Result:
              description: "As publicações da página informada"
              type: array
              items:
                $ref: ../../schemas/v1_cases/DTOPublicacao.yaml
            QuantidadePublicacoesExistente:
              description: "A quantidade de resgistros que corresponde aos parâmetros informados"
              type: integer
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
