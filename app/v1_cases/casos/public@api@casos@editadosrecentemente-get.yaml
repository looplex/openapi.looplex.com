# Linhas com # são comentários e podem ser removidas.
tags:
  - Casos
summary: "Lista os casos editados recentemente"
operationId: api-casos-editadosrecentemente-get
# Parâmetros da requisição
parameters:
  - $ref: ../../parameters/common/Profile.yaml
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - name: obtemUltimoItemTimeLine
    in: query
    required: false
    description: "Se o ultimo item de timeline será incluído na resposta.<br />`Default: false`"
    schema:
      type: boolean
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../schemas/v1_cases/DTOCasoSimples.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
