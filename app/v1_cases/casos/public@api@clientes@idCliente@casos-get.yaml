# Linhas com # são comentários e podem ser removidas.
tags:
  - Casos
summary: "Lista casos do cliente"
operationId: api-clientes-idCliente-casos-get
# Parâmetros da requisição
parameters:
  - $ref: ../../common_parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: idCliente
    in: path
    description: "O identificador do cliente"
    required: true
    schema:
      type: integer
  - name: ativos
    in: query
    description: "Listar os casos ativos?<br />`Default: true`"
    required: false
    schema:
      type: boolean
  - name: inativos
    in: query
    description: "Listar os casos inativos?<br />`Default: false`"
    required: false
    schema:
      type: boolean
  - name: apenasMeusCasos
    in: query
    description: "`Default: false`"
    required: false
    schema:
      type: boolean
  - name: apenasCasosPai
    in: query
    description: "`Default: false`"
    required: false
    schema:
      type: boolean
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../schemas/v1_cases/DTOCasoSimples.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
