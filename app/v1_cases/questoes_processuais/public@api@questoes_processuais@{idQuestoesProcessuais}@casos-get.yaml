# Linhas com # são comentários e podem ser removidas.
tags:
  - Questões Processuais
summary: "Lista  Casos por Questões Processuais"
operationId: api-questoes_processuais-casos-get
# Parâmetros da requisição
parameters:
  - $ref: ../../common_parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: idQuestoesProcessuais
    in: path 
    schema:
      type: integer
  - name: page
    in: query
    schema: 
      type: integer
  - name: pageSize
    in: query
    schema: 
      type: integer


# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/DTOCasoSimples.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
