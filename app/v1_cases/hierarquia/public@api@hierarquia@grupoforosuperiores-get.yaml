tags: 
  - Hierarquia 
summary: "Lista os grupos de foro superiores por ramo judicial"

operationId: api-hierarquia-grupoforosuperiores
parameters:
  - $ref: ../../parameters/common/Profile.yaml
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - name: nrRamoJudicial
    in: query
    required: true
    schema:
      type: integer
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema: 
          type: array
          items:
            $ref: ../../schemas/v1_cases/DTOGrupoForo.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
            
