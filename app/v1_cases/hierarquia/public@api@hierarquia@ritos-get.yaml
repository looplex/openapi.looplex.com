tags: 
  - Hierarquia 
summary: "Lista os ritos de acordo com os filtros informados"
operationId: api-hierarquia-ritos
parameters:
  - $ref: ../../common_parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: nrClasse
    in: query
    required: false
    description: "`Default: null`"
    schema:
      type: integer
  - name: cdRitoDoProcessoPai
    in: query
    required: false
    description: "`Default: null`"
    schema:
      type: integer
  - name: nrRamoJudicial
    in: query
    required: false
    description: "`Default: null`"
    schema:
      type: integer
  - name: cdForo
    in: query
    required: false
    description: "`Default: null`"
    schema:
      type: integer
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema: 
          type: array
          items:
            $ref: ../../schemas/v1_cases/DTOGrupoRito.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
            