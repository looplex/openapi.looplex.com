tags: 
  - Contrato 
summary: "Lista os contratos por situação (ativos / inativos)"
operationId: api-contratos
parameters:
  - $ref: ../../common_parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: ativos
    in: query
    description: "`Default: true`<br />Lista os contratos ativos?"
    required: false
    schema:
      type: boolean
  - name: inativos
    in: query
    description: "`Default: false`<br />Lista os contratos inativos?"
    required: false
    schema:
      type: boolean
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema: 
          type: array
          items:
            $ref: ../../schemas/v1_cases/DTOContrato.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
            
