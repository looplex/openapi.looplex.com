# Linhas com # são comentários e podem ser removidas.
tags:
  - Decisões
summary: "Atualiza decisão"
operationId: api-Decisoes-id-put
# Parâmetros da requisição
parameters:
  - $ref: ../../common_parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: id
    in: path
    description: "O identificador da decisão"
    required: true
    schema:
      type: integer
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
requestBody:
  content:
    application/json:
      schema:
        $ref: ../schemas/DTOProcessoDecisao.yaml
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ../schemas/DTOProcessoDecisao.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
