  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - name: idCaso
    in: path
    description: "O identificador do caso"
    required: true
    schema:
      type: integer
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../schemas/v1_cases/DTOProcessoDecisao.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
