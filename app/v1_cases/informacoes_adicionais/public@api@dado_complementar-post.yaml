# Linhas com # são comentários e podem ser removidas.
tags:
  - Informações adicionais
summary: "Inclui Informações adicionais (completa)"
description: "Cadastrar novas Informações adicionais."
operationId: api-dado_complementar-post
# Parâmetros da requisição
parameters:
  - $ref: ../../parameters/common/Profile.yaml
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
requestBody:
  content:
    application/json:
      schema:
        type: array
        items: 
          $ref: ../../schemas/v1_cases/DTOInformacaoAdicional.yaml
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../schemas/v1_cases/DTOInformacaoAdicional.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml
