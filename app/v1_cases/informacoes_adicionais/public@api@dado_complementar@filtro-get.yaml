# Linhas com # são comentários e podem ser removidas.
tags:
  - Informações adicionais
summary: "Informações adicionais por filtro"
description: '`tiposCaso - Enviar array` <br/> `tiposCampo - Enviar array`'
operationId: api-dado_complementar-filtro-get
# Parâmetros da requisição
parameters:
  - $ref: ../parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml 
  - name: tiposCaso
    in: query
    required: false        
    schema:           
      $ref: ../enums/RamosJudicial.yaml
  - name: tiposCampo
    in: query
    required: false    
    schema:
      $ref: ../enums/TipoDadoComplementar.yaml   

# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../schemas/DTOFiltroInformacaoAdicional.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
