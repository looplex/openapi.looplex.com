# Linhas com # são comentários e podem ser removidas.
tags:
  - Informações adicionais
summary: "Obtém Informação adicional por identificador"
description: "Obtém os dados de uma Informação adicional de acordo com o identificador informado."
operationId: api-dado_complementar-id-get
# Parâmetros da requisição
parameters:
  - $ref: ../parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: IDParametroDadoComplementar
    in: path
    description: "O identificador da Informação adicional"
    required: true
    schema:
      type: integer
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ../schemas/DTOInformacaoAdicional.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
