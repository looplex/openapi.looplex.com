# Linhas com # são comentários e podem ser removidas.
tags:
  - Tarefa
summary: "Inclui / Atualiza Custom Fields (Tarefas)"
description: "Atualiza os custom fields de uma tarefa"
operationId: api-tarefas-custom_field-post
# Parâmetros da requisição
parameters:
  - $ref: ../../common_parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: idCompromisso
    in: query
    required: true
    description: "O identificador da tarefa"
    example: 1
    schema:
      type: integer
  - name: tipoItemAgenda
    in: query
    required: true
    schema:
      $ref: "../enums/TipoItemAgenda.yaml"
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
requestBody:
  content:
    application/json:
      schema:
        type: array
        items: 
          $ref: ../../schemas/v1_cases/DTOCustomFields.yaml
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: "../../schemas/v1_cases/DTOTarefaResponse.yaml"
  "400":
    description: "Bad Request"
    content:
      application/json:
        schema:
          $ref: "../../responses/BadRequestResponse.yaml"
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: "../../responses/UnauthorizedResponse.yaml"
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: "../../responses/ForbiddenResponse.yaml"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: "../../responses/InternalServerErrorResponse.yaml"
