# Linhas com # são comentários e podem ser removidas.
tags:
  - Tarefa
summary: "Lista tarefas e subtarefas pelo identificador da tarefa"
description: "**NOTA: Retorna apenas o item informado e as subtarefas dele**"
operationId: api-tarefa-tarefa_subtarefas-id-tipo-get
# Parâmetros da requisição
parameters:
  - $ref: ../../parameters/common/Profile.yaml
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - name: id
    in: path
    required: true
    description: "O identificador da tarefa"
    example: 1
    schema:
      type: integer
  - name: tipo
    in: path
    required: true
    schema:
      $ref: ../../enums/v1_cases/TipoTarefa.yaml
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/DTOTarefaResponse.yaml

  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml

  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml

  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml

  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v1_cases/ExceptionResponse.yaml

