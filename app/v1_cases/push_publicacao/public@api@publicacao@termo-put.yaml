# Linhas com # são comentários e podem ser removidas.
tags:
  - Push de publicação
summary: "Atualiza termo de publicação"
description: "Atualiza as informações de um termo"
operationId: api-publicacao-termo-put
# Parâmetros da requisição
parameters:
  - $ref: ../../common_parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: IDsTribunais
    in: query
    required: true
    description: "Os identificadores dos tribunais"
    example: [0]
    schema:
      type: array
      items:
        type: integer
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
requestBody:
  content:
    application/json:
      schema:
        $ref: ../schemas/TermoPublicacao.yaml
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: "../schemas/TermoPublicacao.yaml"
  "400":
    description: "Bad Request"
    content:
      application/json:
        schema:
          $ref: "../../responses/BadRequestResponse.yaml"
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: "../../responses/UnauthorizedResponse.yaml"
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: "../../responses/ForbiddenResponse.yaml"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: "../../responses/InternalServerErrorResponse.yaml"
