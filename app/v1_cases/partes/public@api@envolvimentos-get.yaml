# Linhas com # são comentários e podem ser removidas.
tags:
  - Partes
summary: "Lista envolvimentos de parte"
operationId: api-envolvimentos-get
# Parâmetros da requisição
parameters:
  - $ref: ../parameters/Profile.yaml
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: tipoProcesso
    in: query
    required: true
    schema:
      $ref: ../enums/RamosJudicial.yaml
  - name: aplicabilidade
    in: query
    required: true
    schema:
      $ref: ../enums/PartePapelAplicabilidade.yaml
  - name: tipoPolo
    in: query
    required: true
    schema:
      $ref: ../enums/Polo.yaml
# RequestBody aqui (se houver). Verificar menu "Copiar body da requisição"
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../schemas/DTOPartePapel.yaml
  "401":
    description: "Unauthorized"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "403":
    description: "Forbidden"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "404":
    description: "Não encontrado"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../schemas/ExceptionResponse.yaml
