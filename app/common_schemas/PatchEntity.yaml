title: Patch object
type: object
properties:
  path:
    type: string
    example: <property_name>
    description: |
      **The property name**<br/>
      _property_name_
  op:
    type: string
    example: <operation>
    description: |
      **The operation**<br />
      **Available option:**<br/>
      replace
  value:
    description: "**The new value to set**"
    example: <value>
    oneOf:
      - type: string
        description: |
          **A string value**
      - type: number
        description: |
          **A number value**
      - type: object
        description: |
          **A simple object containing one or more properties, depending on Resource property beeing patched**<br />
          ```json
            // Example:
            {
              "<property_name>": "<property_value>",
              ...other properties if needed
            }
            ```
      - type: array
        items:
          type: object
          description: |
            **An object containing one or more properties, depending on Resource property beeing patched**<br/>
            ```json
            // Example:
            [
              {
                "<property_name>": "<property_value>",
                ...other properties if needed
              }
            ]
            ```
required:
  - path
  - op
  - value