title: Patch object
type: object
properties:
  path:
    type: string
    description: "**The property name**"
    example: "<property_name>"
  op:
    type: string
    example: replace
    description: |
      **The operation**<br />
      **Available option:**<br/>
      replace
  value:
    description: "**The new value to set**"
    oneOf:
      - type: string
        example: "new value"
      - type: number
        example: 10
      - type: object
        example: {}
required:
  - path
  - op
  - value