tags:
  - Procedures
summary: "Procedures by filter"
description: |
  **Procedures by filter**<br/>
  `At least one of these parameters are required: nodeId, procedureId or procedureName`
operationId: v3-procedures-get
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - name: nodeId
    in: query
    required: false
    description: "**The court venue identifier**"
    schema:
      type: string
      format: uuid
  - name: procedureId
    in: query
    required: false
    description: "**The procedure identifier**"
    schema:
      type: string
      format: uuid
  - name: procedureName
    in: query
    required: false
    description: "**The procedure name**"
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              group:
                type: string
                description: "**The group name**"
                example: <group_name>
              id:
                type: string
                format: uuid
                description: "**The group identifier**"
                example: <global_unique_identifier>
              children:
                type: array
                description: "**The list of subgroups**"
                items:
                  type: object
                  properties:
                    subGroup:
                      type: string
                      description: "**The subgroup name**"
                      example: <subgroup_name>
                    id:
                      type: string
                      format: uuid
                      description: "**The subgroup identifier**"
                      example: <global_unique_identifier>
                    children:
                      type: array
                      description: "**The list of procedures**"
                      items:
                        type: object
                        properties:
                          procedure:
                            type: string
                            description: "**The procedure name**"
                            example: <procedure_name>
                          id:
                            type: string
                            format: uuid
                            description: "**The procedure identifier**"
                            example: <global_unique_identifier>
                          cnjCode:
                            type: string
                            description: "**The CNJ code**"
                            example: <cnj_code>
                          customFields:
                            type: object
                            description: "**Custom fields for this item**"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'