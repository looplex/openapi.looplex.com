tags:
  - Court Venue
summary: "Next levels of Court Venue"
description: "**List next levels of informed Court Venue**"
operationId: v3-court-id-nextLevels-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - name: quantityLevels
    in: query
    required: false
    description: "**The quantity of levels to return**<br/>`Default: 2`"
    schema:
      type: integer
  - name: id
    in: path
    required: true
    description: "**The unique identifier of the item to fetch the children**"
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../schemas/common/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../schemas/ForoEntity_v3.yaml
 
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'