tags:
  - Regions

summary: "Regions"

description: "**Fetch items paginated**"

operationId: Regions-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/StartIndex.yaml
  - $ref: ../../common_parameters/Count.yaml
  - $ref: ../../common_parameters/Filter.yaml

  - name: CountryId
    in: query    
    schema:
      type: string
      format: uuid
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../common_schemas/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../schemas/RegionEntityQuery.yaml
 
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'