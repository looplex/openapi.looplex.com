tags:
  - Countries

summary: "/Countries"

description: "**Fetch items paginated**"

operationId: Countries-get
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/StartIndex.yaml
  - $ref: ../../parameters/common/Count.yaml
  - $ref: ../../parameters/common/Filter.yaml
  
  - name: CountryId
    in: query    
    schema:
      type: string
      format: uuid
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../schemas/common/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../schemas/v2_locales/CountryEntityQuery.yaml
 
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'