tags:
  - Localities
summary: "/Localities"
description: "**Fetch items paginated**"
operationId: Localities-get
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml  
  - $ref: ../../parameters/scim/StartIndex.yaml
  - $ref: ../../parameters/scim/Count.yaml
  - $ref: ../../parameters/scim/Filter.yaml
  - name: RegionId
    in: query
    schema:
      type: string
      format: uuid
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../schemas/common/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../schemas/v2_locales/LocalityEntityQuery.yaml
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'