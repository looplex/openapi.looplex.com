tags:
  - Occupations

summary: "Occupations"

description: "**Fetch items paginated**"


operationId: Ocupations-get
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml  
  - $ref: ../../parameters/common/StartIndex.yaml
  - $ref: ../../parameters/common/Count.yaml
  - $ref: ../../parameters/common/Filter.yaml
  
  - name: Id
    in: query    
    description: "Pode ser passado mais de um Id separado por vírgula"
    schema:
      type: string
      format: uuid
  - name: Code
    in: query    
    schema:
      type: string
  - name: Name
    in: query    
    schema:
      type: string
  - name: Status
    in: query    
    schema:
      type: string
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../schemas/common/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../schemas/v2_occupations/OccupationEntityQuery.yaml
 
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'