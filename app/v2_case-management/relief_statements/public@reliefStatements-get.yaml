summary: "/reliefStatements"
description: "**Fetch items paginated**"
operationId: reliefStatements-get
parameters:
  - $ref: ../../../app/parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../../app/parameters/common/Tenant.yaml
  - $ref: ../../../app/parameters/common/BearerToken.yaml
  - $ref: ../../../app/parameters/scim/StartIndex.yaml
  - $ref: ../../../app/parameters/scim/Count.yaml
  - $ref: ../../../app/parameters/scim/Filter.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../schemas/common/ListResponse.yaml
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../schemas/v2_case-management/ReliefStatementEntityQuery.yaml
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../scim/SCIMError.yaml