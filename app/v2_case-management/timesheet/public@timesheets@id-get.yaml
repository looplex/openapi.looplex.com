tags:
  - Timesheet
summary: "/Timesheets/:id"
description: |
  **Retrieve a timesheet by id**
operationId: timesheets-id-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - $ref: ../../common_parameters/Id.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ../schemas/TimesheetEntityRetrieve.yaml
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'