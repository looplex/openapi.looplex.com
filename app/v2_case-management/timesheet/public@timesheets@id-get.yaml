tags:
  - Timesheet
summary: "/timesheets/:id"
description: |
  **Retrieve a timesheet by id**
operationId: timesheets-id-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - $ref: ../parameters/Id.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ../schemas/TimesheetEntity.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'