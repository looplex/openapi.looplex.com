tags:
  - Timesheet
summary: "/timesheets/:id"
description: |
  **Delete a timesheet by unique identifier**<br />
  Um lançamento que já está em faturamento não pode ser excluído (retorna erro). A exclusão é física
operationId: timesheets-id-delete
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - $ref: ../../parameters/common/Id.yaml
responses:
  "204":
    description: "No Content"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../scim/SCIMError.yaml
