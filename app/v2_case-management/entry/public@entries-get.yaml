tags:
  - Entry
summary: "/Entries"
description: |
  **Fetch entries paginated**
operationId: entries-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - $ref: ../../common_parameters/StartIndex.yaml
  - $ref: ../../common_parameters/Count.yaml
  - $ref: ../../common_parameters/Filter.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../common_schemas/ListResponse.yaml'
            - type: object
              properties:
                Resources:
                  type: array
                  items:
                    $ref: ../schemas/EntryEntity.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'