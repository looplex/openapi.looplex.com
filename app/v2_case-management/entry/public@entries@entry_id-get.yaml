tags:
  - Entry
summary: "/entries/:id"
description: |
  **Retrieve an entry by id**
operationId: entries-entry_id-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - $ref: ../parameters/Id.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ../schemas/EntryEntity.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'