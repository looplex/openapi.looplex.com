tags:
  - Entry
summary: "/entries/:entry_id"
description: |
  **Retrieve an entry by id**
operationId: entries-entry_id-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - name: entry_id
    in: path
    required: true
    description: "**The entry id**"
    schema:
      type: integer
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ../schemas/EntryEntity.yaml
  "500":
    description: "Internal Server Error"