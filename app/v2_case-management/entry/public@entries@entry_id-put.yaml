tags:
  - Entry
summary: "/entries/:entry_id"
description: |
  **Update entry**
operationId: entries-entry_id-put
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - name: entry_id
    in: path
    required: true
    description: "**Entry unique id**"
    schema:
      type: string
      format: uuid
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: boolean
  "500":
    description: "Internal Server Error"
 