# https://redocly.com/docs/openapi-visual-reference/info/
openapi: 3.1.1
info:
  version: 1.43.0
  title: "Looplex Case Management"
  termsOfService: "https://docs.looplex.com.br/legal/termos-de-uso"
  contact:
    name: Developers Looplex
    email: developer@looplex.com.br
    url: "https://www.looplex.com.br"
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
  x-logo:
    url: "https://www.looplex.com.br/img/logo-default.png"
    href: "/"
  description: >
    Essa é a documentação da API Case Management
servers:
  - url: "https://apim.looplex.com/case-management/v1"
    description: "Case Management Server"
paths:

  # Authentication
  /token:
    post:
      $ref: authentication\public@token-post.yaml

  # Bulk operation
  /bulk:
    post:
      $ref: bulk\public@bulk-post.yaml

  # Search / Filter
  /{resource}/.search:
    post:
      $ref: search\public@.search-post.yaml

  # Case
  /cases/{id}:
    get:
      $ref: case\public@cases@uniqueId-get.yaml
    patch:
      $ref: case\public@cases-patch.yaml
  /cases:
    get:
      $ref: case\public@cases-get.yaml
    post:
      $ref: case\public@cases-post.yaml

  # Case Groups
  /caseGroups:
    get:
      $ref: case_groups\public@caseGroups-get.yaml
  /caseGroups/{id}:
    get:
      $ref: case_groups\public@caseGroups@case_group_id-get.yaml

  # Claims
  /claims:
    get:
      $ref: claim\public@claims-get.yaml
    post:
      $ref: claim\public@claims-post.yaml
  /claims/{id}:
    get:
      $ref: claim\public@claims@claim_id-get.yaml
    patch:
      $ref: claim\public@claims@claim_id-patch.yaml
    delete:
      $ref: claim\public@claims-delete.yaml

  # Client
  /clients:
    get:
      $ref: client\public@clients-get.yaml
    post:
      $ref: client\public@clients-post.yaml
  /clients/{id}:
    get:
      $ref: client\public@clients@client_id-get.yaml
    patch:
      $ref: client\public@clients-patch.yaml

  # Case Guarantees
  /caseGuarantees:
    get:
      $ref: case_guarantee\public@caseGuarantees-get.yaml
    post:
      $ref: case_guarantee\public@caseGuarantees-post.yaml
  /caseGuarantees/{id}:
    get:
      $ref: case_guarantee\public@caseGuarantees@caseGuarantee_id-get.yaml
    patch:
      $ref: case_guarantee\public@caseGuarantees@caseGuarantee_id-patch.yaml
    delete:
      $ref: case_guarantee\public@caseGuarantees-delete.yaml

  # Case Guarantee Movements
  /caseGuaranteeMovements:
    get:
      $ref: case_guarantee_movement\public@caseGuaranteeMovements-get.yaml
    post:
      $ref: case_guarantee_movement\public@caseGuaranteeMovements-post.yaml
  /caseGuaranteeMovements/{id}:
    get:
      $ref: case_guarantee_movement\public@caseGuaranteeMovements@caseGuaranteeMovement_id-get.yaml
    patch:
      $ref: case_guarantee_movement\public@caseGuaranteeMovements@caseGuaranteeMovement_id-patch.yaml
    delete:
      $ref: case_guarantee_movement\public@caseGuaranteeMovements-delete.yaml

  # Custom fields
  /{resource}/{id}:
    patch:
      $ref: custom_fields\public@custom_fields-patch.yaml

  # Decisions
  /decisions:
    get:
      $ref: decision\public@decisions-get.yaml
    post:
      $ref: decision\public@decisions-post.yaml
  /decisions/{id}:
    get:
      $ref: decision\public@decisions@decision_id-get.yaml
    patch:
      $ref: decision\public@decisions@decision_id-patch.yaml
    delete:
      $ref: decision\public@decisions-delete.yaml

  # Collaborators
  /collaborators:
    get:
      $ref: collaborators\public@collaborators-get.yaml
    post:
      $ref: collaborators\public@collaborators-post.yaml
  /collaborators/{id}:
    get:
      $ref: collaborators\public@collaborators@collaborator_id-get.yaml
    patch:
      $ref: collaborators\public@collaborators@collaborator_id-patch.yaml

  # Entry
  /entries/{id}:
    get:
      $ref: entry\public@entries@entry_id-get.yaml
    patch:
      $ref: entry\public@entries@entry_id-patch.yaml
    delete:
      $ref: entry\public@entries@id-delete.yaml
  /entries:
    get:
      $ref: entry\public@entries-get.yaml
    post:
      $ref: entry\public@entries-post.yaml

  # External service provider
  /externalServiceProviders:
    get:
      $ref: external_service_providers\public@externalServiceProviders-get.yaml
  /externalServiceProviders/{id}:
    get:
      $ref: external_service_providers\public@externalServiceProviders@id-get.yaml

  # LegalCategory (Natures)
  /legalCategories:
    get:
      $ref: legal_category\public@legalCategories-get.yaml
    post:
      $ref: legal_category\public@legalCategories-post.yaml
  /legalCategories/{id}:
    get:
      $ref: legal_category\public@legalCategories@legalCategory_id-get.yaml

  # Legal service agreement
  /legalServiceAgreements:
    post:
      $ref: legal_service_agreement\public@LegalServiceAgreement-post.yaml
    get:
      $ref: legal_service_agreement\public@legalServiceAgreement-get.yaml
  /legalServiceAgreements/{id}:
    get:
      $ref: legal_service_agreement\public@legalServiceAgreements@id-get.yaml

  # Participant
  /participants:
    post:
      $ref: participant\public@participants-post.yaml
    get:
      $ref: participant\public@participants-get.yaml
  /participants/{id}:
    get:
      $ref: participant\public@participants@participant_id-get.yaml
    patch:
      $ref: participant\public@participants@participant_id-patch.yaml
    delete:
      $ref: participant\public@participants@participant_id-delete.yaml

  # Performances
  /performances:
    get:
      $ref: performance\public@performances-get.yaml
    post:
      $ref: performance\public@performances-post.yaml
  /performances/{id}:
    get:
      $ref: performance\public@performances@performance_id-get.yaml
    patch:
      $ref: performance\public@performances@performance_id-patch.yaml
    delete:
      $ref: performance\public@performances-delete.yaml

  # Participant Roles
  /participantRoles:
    get:
      $ref: participantRoles\public@participantRoles-get.yaml

  # Phases
  /phases:
    get:
      $ref: phases\public@phases-get.yaml
  /phases/{id}:
    get:
      $ref: phases\public@phases@id-get.yaml

  # Relief Statement
  /reliefStatements:
    get:
      $ref: relief_statements\public@reliefStatements-get.yaml
  /reliefStatements/{id}:
    get:
      $ref: relief_statements\public@reliefStatements@id-get.yaml

  # Products
  /products:
    get:
      $ref: products\public@products-get.yaml
  /products/{id}:
    get:
      $ref: products\public@products@id-get.yaml

  /subjectMatters:
    get:
      $ref: subjectMatters\public@subjectMatters-get.yaml
  /subjectMatters/{id}:
    get:
      $ref: subjectMatters\public@subjectMatters@id-get.yaml

  # Timesheet
  /timesheets:
    get:
      $ref: timesheet\public@timesheets-get.yaml
    post:
      $ref: timesheet\public@timesheets-post.yaml
  /timesheets/{id}:
    get:
      $ref: timesheet\public@timesheets@id-get.yaml

  # Court Order
  /CourtOrders:
    get:
      $ref: court_order/public@CourtOrders-get.yaml    
      
   # Docket Entry
  /docketEntries:
    get:
      $ref: docket_entry\public@DocketEntries-get.yaml
  
  
  # Decision Types
  /decisionTypes:
    get:
      $ref: decision_types\public@decisionTypes-get.yaml

  # Judgement Contents
  /judgementContents:
    get:
      $ref: judgement_contents\public@judgementContents-get.yaml

  # Procedural Matters
  /proceduralMatters:
    get:
      $ref: procedural_matters\public@proceduralMatters-get.yaml

  # Remedies
  /remedies:
    get:
      $ref: remedies\public@remedies-get.yaml

  # Trial Types
  /trialTypes:
    get:
      $ref: trial_types\public@trialTypes-get.yaml
