tags:
  - Collaborator
summary: "/collaborators"
description: |
  **Create a collaborator**<br />
  Required: `Name` (max 60), `NickName` (max 60), `Role` (VinculoEmpregaticio), `AdmissionDate`, `MaritalStatus`, `Occupation`, `Status` (BooleanStatus), `Gender` and a `CPF` identity (11 digits). `RG` max 30 characters.<br />
  Dates (`Dob`, `AdmissionDate`, `DemissionDate`) must be sent in UTC.<br />
  Item created's guid is returned in **Location header**
operationId: collaborators-post
parameters:
  - $ref: ../../../app/parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../../app/parameters/common/Tenant.yaml
  - $ref: ../../../app/parameters/common/BearerToken.yaml
requestBody:
  content:
    application/json:
      schema:
        $ref: ../../../app/schemas/v2_case-management/CollaboratorEntityWrite.yaml
responses:
  "201":
    description: "Created"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../scim/SCIMError.yaml