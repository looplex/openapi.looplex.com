tags:
  - Collaborator
summary: "/collaborators"
description: |
  **Fetch items paginated**<br />
  Valid filter properties: `Id`, `Name`, `NickName`, `Dob`, `Gender`, `MaritalStatus`, `Occupation`, `AdmissionDate`, `DemissionDate`, `Status`, `Role`, `Emails.Value`, `ExternalServiceProviderId`, `CompanyId`, `Affiliation.Id`, `Affiliation.Name`, `Affiliation.Document`, `Affiliation.Email`<br />
  Collaborators of the law office itself (no provider or company): `Affiliation.Id eq "null"` (`null` must be quoted; `pr` is not supported).
operationId: collaborators-get
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - $ref: ../../parameters/scim/StartIndex.yaml
  - $ref: ../../parameters/scim/Count.yaml
  - $ref: ../../parameters/scim/Filter.yaml
  - $ref: ../../parameters/common/SortBy.yaml
  - $ref: ../../parameters/common/SortOrder.yaml
responses:
  "200":
      description: "OK"
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../schemas/common/ListResponse.yaml'
              - type: object
                properties:
                  Resources:
                    type: array
                    items:
                      $ref: ../../schemas/v2_case-management/CollaboratorEntityGet.yaml
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'