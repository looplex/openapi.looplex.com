tags:
  - Address
summary: "/addresses"
description: |
  **Create Address**<br />
  Item created's guid is returned in **Location header**<br />
  `StreetAddress`, `Type` (valor de `AddressType`, sem diferenciar maiúsculas), `Region.Name` (sigla do estado, 2 letras) e `PostalCode` (8 dígitos, qualquer máscara) são obrigatórios.<br />
  **Atenção:** o contexto do endereço (`Context`) não é lido do corpo da requisição (`[JsonIgnore]`) e a criação exige `Context` e `ContextId`; conferido apenas no código, não em execução
operationId: addresses-post
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
requestBody:
  content:
    application/json:
      schema:
        $ref: ../../schemas/v2_case-management/AddressEntityWrite.yaml
responses:
  "201":
    description: "Created"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../scim/SCIMError.yaml
