tags:
  - Address
summary: "/addresses/:id"
description: |
  **Patch properties**<br />
  Propriedades que podem ser alteradas: `StreetAddress`, `StreetAddressNumber`, `ExtendedAddress`, `Type`, `Country`, `Region`, `Locality`, `PostalCode` e `CustomFields`
operationId: addresses-id-patch
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - $ref: ../../parameters/common/Id.yaml
requestBody:
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: ../../schemas/common/PatchEntity.yaml
responses:
  "204":
    description: "No Content"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../scim/SCIMError.yaml
