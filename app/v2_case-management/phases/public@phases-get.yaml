tags:
  - Phase
summary: "/phases"
description: "**Fetch items paginated**"
operationId: phases-get
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - $ref: ../../parameters/scim/StartIndex.yaml
  - $ref: ../../parameters/scim/Count.yaml
  - $ref: ../../parameters/scim/Filter.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../schemas/common/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../schemas/v2_case-management/PhaseEntityQuery.yaml
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'