tags:
  - Additional information
summary: "/additionalInformations"
description: |
  **Create Additional information**<br />
  Item created's guid is returned in **Location header**<br />
  Só pode haver um tipo de vínculo entre `Client`, `ClientGroups`, `Groups` e `CaseTypes`. `Values` só é aceito em tipos dropdown. `FieldSize` é obrigatório nos tipos texto. `Cases` e `Employees` são somente leitura (use `/additionalInformationValues`)
operationId: additionalInformations-post
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
requestBody:
  content:
    application/json:
      schema:
        $ref: ../../schemas/v2_case-management/AdditionalInformationEntityWrite.yaml
responses:
  "201":
    description: "Created"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../scim/SCIMError.yaml
