title: Claim
type: object
properties:
  CaseId:
    type: string
    format: uuid
    description: "**Case's unique identifier of this claim**"
  SubjectMatter:
    type: string
    description: "**Question's general classification**"
  ReliefStatement:
    type: string <nullable>
    description: "**Request for resolution of a dispute, stating interpretation of situation or status, or creating an obligation to pay, to do, or not to do**"
  RemedyType:
    $ref: ../enums/TipoReparacao.yaml
  ProvisionalRelief:
    $ref: ../enums/TipoTutela.yaml
  AgainstPosition: 
    type: string
    description: |
      **Participant's position**<br />
      ACTIVE<br/>
      PASSIVE<br/>
      THIRD_PARTY
  Participants:
    description: |
      **Participant's identifiers**<br/>
      _These participants should be binded to this case in the same position as the claim_
    type: array
    items:
      type: string
      format: uuid
  RiskClassification:
    $ref: ../enums/ContingentLiabilityRiskClassification.yaml
  ForeseenValue:
    type: number
    description: "**Foreseen value**"
  Liquidated:
    type: boolean
    description: "**Indicação se o valor previsto é líquido (ainda que o montante seja disputado) ou apenas uma estimativa**"
  EffectiveDate:
    type: string
    format: datetime
    description: "**Data de constituição**"
  DueDate:
    type: string
    format: datetime
    description: "**Data de vencimento**"
  Recorrence:
    $ref: ../enums/TipoDeRecorrencia.yaml
  Status:
    $ref: ../enums/ClaimStatus.yaml
required:
  - CaseId
  - SubjectMatter
  - RemedyType
  - AgainstPosition
  - Recorrence