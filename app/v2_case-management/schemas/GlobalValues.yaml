title: Valores globais do caso por polo
type: object
properties: 
  againstPosition:
    example: ACTIVE
    $ref: ../enums/Position.yaml
    description: "**Contra polo ativo, passivo, terceiro...**"
  perspective:
    $ref: ../enums/TipoExpectativaReivindicacao.yaml
  riskClassification:
    $ref: ../enums/ContingentLiabilityRiskClassification.yaml
  currency:
    $ref: ../enums/Moeda.yaml
    description: "**Moeda usada para os valores do caso**"
  caseDeclaredValue:
    type: number <nullable>
    description: |
      **Valor da causa**<br />
      Valor declarado na petição inicial, no contrato ou no documento que formaliza a obrigação
    example: 0
  caseForeseenValue:
    type: number <nullable>
    description: |
      **Valor previsto**<br />
      Valor estimado para a resolução do caso, transação ou disputa
    example: 0
  caseContingencyValue:
    type: number <nullable>
    description: |
      **Valor de contingência**<br />
      Valor de provisionamento vinculado a perspectiva e risco do caso. <br />
      Para os casos de êxito é uma estimativa do valor que poderá receber, e para os casos de perda é uma estimativa do valor que poderá pagar
    example: 0