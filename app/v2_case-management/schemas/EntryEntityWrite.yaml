title: Dados do andamento
type: object
properties:
  date:
    type: string
    format: datetime
    example: "2025-05-21T12:00:00.000Z"
    description: "**Data do andamento**"
  classification:
    type: string <nullable>
    description: "**Classificação do andamento**"
  description:
    type: string
    description: "**Texto do andamento**"
  isInternal:
    type: boolean
    description: "**Indica se o andamento é de uso interno**"
  classificationType:
    $ref: ../enums/TipoClassificacaoAutomatica.yaml
  caseId:
    type: string
    format: uuid
    description: |
      **Case's unique identifier**<br/>
      `Obrigatório apenas quando o andamento não estiver sendo criado junto com o caso`
  customFields:
    type: object
    example: {}
    description: "**Entry's custom fields**"