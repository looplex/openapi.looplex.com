title: Timesheet
type: object
allOf:
  - $ref: ../../scim/Resource.yaml
  - type: object
    properties:
      clientId:
        type: string
        format: uuid
        description: "**Client unique identifier**"
      classification:
        type: string <nullable>
        description: "**Classificação**"
      owner:
        $ref: ../../common_schemas/SimpleEntity.yaml
        description: "**Responsável**"
      date:
        type: string
        format: datetime
        description: "**Data**"
      hours:
        type: string
        example: "01:00:00"
        description: |
          **Horas (quantidade de horas do lançamento)**<br />
          `Format: hh:mm:ss`
      taskCode:
        type: string <nullable>
        description: "**Código da Tarefa**"
      activityCode:
        type: string <nullable>
        description: "**Código da Atividade**<br />"
      applicant:
        $ref: ../../common_schemas/SimpleEntity.yaml
        description: "**Solicitante**<br />"
      description:
        type: string <nullable>
        example: "Descrição"
        description: "**Descrição**"
      isInvoiced:
        type: boolean <nullable>
        example: false
        description: "**Faturado**"
      createdAt:
        type: string <nullable>
        format: datetime
        example: "2025-01-01T12:00:00.000"
        description: "**Criado em**"
      createdBy:
        $ref: ../../common_schemas/SimpleEntity.yaml
        description: "**Criado por**"
      updatedAt:
        type: string <nullable>
        format: datetime
        example: "2025-01-02T12:00:00.000"
        description: "**Atualizado em**"
      updatedBy:
        $ref: ../../common_schemas/SimpleEntity.yaml
        description: "**Atualizado por**"
      case:
        type: object
        description: "**The case unique identifier**"
        properties:
          id:
            type: string
            format: uuid
      taskType:
        $ref: ../enums/TipoDeTarefaTimesheet.yaml