title: Dados de Parte
type: object
properties:
  CaseId: 
    type: string
    format: uuid
    description: |
      **Identificador único do caso**<br/>
      `Obrigatório apenas quando a parte não estiver sendo criada junto com o caso`
  Name:
    type: string
    description: "**Participant's name**"
  Nickname:
    type: string <nullable>
    description: "**Apelido**"
  IsMainParty:
    type: bool
    description: "**Indica se é a parte principal**"
  Represents:
    type: array
    items:
      oneOf:
        - type: string (document)
          example: "000.000.000-00"
          description: "**Documento da parte representada**"
        - type: string (unique identifier)
          format: uuid
          description: "**Unique identifier da parte representada**"
  LawyerOffice:
    type: string <nullable>
    description: "**Escritório do advogado (se houver)**"
  Nature:
    example: NATURAL_PERSON
    $ref: ../enums/TipoPessoa.yaml
  Position:
    example: OTHER
    $ref: ../enums/Position.yaml
  Emails:
    description: "**Emails**"
    type: array
    items:
      $ref: EmailEntityWrite.yaml
  Identities:
    description: "**CNPJ, Inscrição estadual, Inscrição municipal, CPF, RG, etc.**"
    type: array
    items:
      oneOf:
        - $ref: ../../common_schemas/LegalPersonIdentityEntityWrite.yaml
        - $ref: ../../common_schemas/NaturalPersonIdentityEntityWrite.yaml
  Role:
    $ref: ../enums/ParticipantRole.yaml
  CustomFields:
    type: object
    example: {}
    description: "**Participant's custom fields**"