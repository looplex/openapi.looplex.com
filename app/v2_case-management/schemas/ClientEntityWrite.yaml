title: Cliente
type: object
description: |
  **Cliente**<br />
  Qualquer pessoa ou entidade que contrata ou retém uma equipe jurídica para gerenciar ou conduzir atividades em um caso em seu nome
properties:
  name:
    type: string
    example: "Example name"
    description: "**Client's name**"
  nickName:
    type: string
    example: "Example nickname"
    description: "**Client's nickname**"
  type:
    $ref: ../enums/TipoPessoa.yaml
  email:
    type: string <nullable>
    example: "dont_exists@email.com"
    description: "**Client's email address**"
  website:
    type: string <nullable>
    example: "dont-exists.com"
    description: "**The client's website page**"
  comments:
    type: string <nullable>
    description: "**Comments about the client**"
    example: "Comments"
  dob:
    type: string <nullable>
    format: datetime
    description: "**Client's date of birth (available when NATURAL_PERSON)**"
    example: "2025-01-01T12:00:00.000Z"
  gender:
    $ref: ../enums/Gender.yaml
    description: "**Client's gender (available when NATURAL_PERSON)**"
  maritalStatus:
    $ref: ../enums/MaritalStatus.yaml
    description: "**Client's marital status (available when NATURAL_PERSON)**"
  identities:
    type: array
    items:
      oneOf:
        - $ref: ../../common_schemas/NaturalPersonIdentityEntityWrite.yaml
        - $ref: ../../common_schemas/LegalPersonIdentityEntityWrite.yaml
  phoneNumbers:
    type: array
    items:
      $ref: ./PhoneNumberEntity.yaml
  addresses:
    type: array
    items:
      $ref: ./AddressEntityWrite.yaml
  customFields:
    type: object
    description: "**Client's custom fields**"
required:
  - name
  - nickName
  - type