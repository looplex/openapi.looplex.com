title: Endereço
type: object
properties:
  Country:
    type: string <nullable>
    example: "BR"
    description: "**ISO 3166-1 alpha2 value (2 caracteres)**"
  PostalCode:
    type: string <nullable>
    example: "00000-000"
  StreetAddress:
    example: "Avenida exemplo"
    type: string <nullable>
  StreetAddressNumber:
    type: string <nullable>
    example: "10"
  Pobox:
    type: string <nullable>
    example: null
  Locality:
    type: string <nullable>
    example: "SP"
  Region:
    type: string <nullable>
    example: "São Paulo"
  Neighborhood:
    type: string <nullable>
    example: "Centro"
  Type:
    $ref: ../enums/TipoDeEndereco.yaml
  Primary:
    type: boolean
    example: true
    description: "**Se é o endereço principal**"