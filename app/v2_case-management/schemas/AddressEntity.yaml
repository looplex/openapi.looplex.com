title: Address
type: object
allOf:
  - $ref: ../../scim/Resource.yaml
  - type: object
    properties:
      country:
        type: string <nullable>
        example: "<pais>"
        description: "**ISO 3166-1 alpha2 value (2 caracteres)**"
      postalCode:
        type: string <nullable>
        example: "<cep>"
        description: "**Postal code**"
      streetAddress:
        type: string
        example: "<logradouro>"
        description: "**Street**"
      streetAddressNumber:
        type: string <nullable>
        example: "<numero_do_logradouro>"
        description: "**Street number**"
      pobox:
        type: string <nullable>
        example: "<caixa_postal>"
        description: "**PO box**"
      locality:
        type: string <nullable>
        example: "<sigla_estado>"
        description: "**State**"
      region:
        type: string <nullable>
        example: "<cidade>"
        description: "**City**"
      neighborhood:
        type: string <nullable>
        example: "<bairro>"
        description: "**Neighborhood**"
      complement:
        type: string
        description: "**Address' complement**"
        example: "<complemento>"
      type:
        $ref: ../enums/AddressType.yaml
      primary:
        type: boolean
        example: true
        description: "**Is this the main address?**"
      customFields:
        type: object
        description: "**Address' custom fields**"