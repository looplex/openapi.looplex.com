title: Address
type: object
allOf:
  - $ref: ../../scim/Resource.yaml
  - type: object
    properties:
      country:
        type: string <nullable>
        example: "BR"
        description: "**ISO 3166-1 alpha2 value (2 caracteres)**"
      postalCode:
        type: string <nullable>
        example: "00000-000"
        description: "**Postal code**"
      streetAddress:
        type: string
        example: "Avenida exemplo"
        description: "**Street**"
      streetAddressNumber:
        type: string <nullable>
        example: "10"
        description: "**Street number**"
      pobox:
        type: string <nullable>
        example: null
        description: "**PO box**"
      locality:
        type: string <nullable>
        example: "SP"
        description: "**State**"
      region:
        type: string <nullable>
        example: "São Paulo"
        description: "**City**"
      neighborhood:
        type: string <nullable>
        example: "Centro"
        description: "**Neighborhood**"
      complement:
        type: string
        description: "**Address' complement**"
      type:
        $ref: ../enums/AddressType.yaml
      primary:
        type: boolean
        example: true
        description: "**Is this the main address?**"
      customFields:
        type: object
        description: "**Address' custom fields**"