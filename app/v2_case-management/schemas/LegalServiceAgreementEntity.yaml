title: "Legal service agreement"
type: object
allOf:
  - $ref: ../../scim/Resource.yaml
properties:
  clientId:
    type: string
    format: uuid
    description: "**Client's unique identifier**"
  name:
    type: string
    description: "Legal service agreement's title"
  summary:
    type: string
    description: "Legal service agreement's summary"
  createdAt:
    type: string
    format: datetime
    description: "Legal service agreement's created date"
  startDate:
    type: string
    format: datetime
    description: "Legal service agreement's start date"
  forecastedEndDate:
    type: string
    format: datetime
    description: "Legal service agreement's forecasted end date"
  dueDate:
    type: string
    format: datetime
    description: "Legal service agreement's due date"
  isSameReviewerAttorneyFeesAndExpenses:
    type: boolean
  isSamePayerAttorneyFeesAndExpenses:
    type: boolean
  billingCompanyId:
    type: string
    format: uuid
  ownerId:
    type: string
    format: uuid
  number:
    type: integer
  kilometersReimbursement:
    $ref: ../enums/ContratoReembolsoKM.yaml
  expenseRuleLocal:
    $ref: ../enums/TipoRegraAprovacaoLimiteDespesas.yaml
  status:
    $ref: ../enums/ContratoSituacao.yaml
  isDefault:
    type: boolean