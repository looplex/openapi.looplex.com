title: Dados de Parte
type: object
allOf:
  - $ref: ../../scim/ResourceRetrieve.yaml
  - type: object
    properties:
      createdBy:
        $ref: ../../common_schemas/SimpleEntityRetrieve.yaml
      name:
        type: string
        example: <nome_da_parte>
        description: "**Participant's name**"
      nickname:
        type: string <nullable>
        example: <apelido_da_parte>
        description: "**Apelido**"
      lawyerOffice:
        type: string <nullable>
        description: "**Escritório do advogado (se houver)**"
        example: <escritorio>
      nature:
        example: NATURAL_PERSON
        $ref: ../enums/TipoPessoa.yaml
      addresses:
        description: "**Endereços**"
        type: array
        items:
          $ref: AddressEntityRetrieve.yaml
      emails:
        description: "**Emails**"
        type: array
        items:
          $ref: EmailEntityRetrieve.yaml
      identities:
        description: "**CNPJ, Inscrição estadual, Inscrição municipal, CPF, RG, etc.**"
        type: array
        items:
          oneOf:
            - $ref: ../../common_schemas/NaturalPersonIdentityEntityRetrieve.yaml
            - $ref: ../../common_schemas/LegalPersonIdentityEntityRetrieve.yaml
      phoneNumbers:
        description: "**Telefones**"
        type: array
        items:
          $ref: PhoneNumberEntityRetrieve.yaml
      role:
        $ref: ../enums/ParticipantRole.yaml
      customFields:
        type: object
        example: {}
        description: "**Participant's custom fields**"