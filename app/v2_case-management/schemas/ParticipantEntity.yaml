title: Dados de Parte
type: object
allOf:
  - $ref: ../../scim/Resource.yaml
  - type: object
    properties:
      CreatedBy: 
        $ref: ../../common_schemas/SimpleEntity.yaml
      Name:
        type: string
        description: "**Participant's name**"
      Nickname:
        type: string <nullable>
        description: "**Apelido**"
      LawyerOffice:
        type: string <nullable>
        description: "**Escritório do advogado (se houver)**"
      Nature:
        example: NATURAL_PERSON
        $ref: ../enums/TipoPessoa.yaml
      Addresses:
        description: "**Endereços**"
        type: array
        items:
          $ref: AddressEntity.yaml
      Emails:
        description: "**Emails**"
        type: array
        items:
          $ref: EmailEntity.yaml
      Identities:
        description: "**CNPJ, Inscrição estadual, Inscrição municipal, CPF, RG, etc.**"
        type: array
        items:
          $ref: ../../common_schemas/IdentityEntity.yaml
      PhoneNumbers:
        description: "**Telefones**"
        type: array
        items:
          $ref: PhoneNumberEntity.yaml
      Role:
        $ref: ../enums/ParticipantRole.yaml
      CustomFields:
        type: object
        example: {}
        description: "**Participant's custom fields**"