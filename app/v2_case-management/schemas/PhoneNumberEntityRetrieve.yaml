title: Phone number
type: object
properties:
  value:
    type: string
    description: "**Phone number**"
    example: <numero_do_telefone>
  type:
    $ref: ../enums/TipoDeTelefone.yaml
  primary:
    type: boolean
    description: |
      **A Boolean value indicating the 'primary' or preferred attribute value for this attribute, e.g., the preferred phone number or primary phone number**<br />
      The primary attribute value 'true' MUST appear no more than once.
    example: true
  contact:
    type: string
    description: "**Contact name**"
    example: <contato>
  extension:
    type: string
    description: "**Phone's extension**"
    example: <extensao>
  countryCode:
    type: integer
    description: "**Phone's country code**"
    example: <codigo_do_pais>
  customFields:
    type: object
    description: "**Phone's custom fields**"
required: 
  - value
  - type
  - primary