title: Funcionário
type: object
allOf:
  - $ref: ../../scim/Resource.yaml
  - type: object
    properties:
      name:
        type: string
        description: "**Employee's name**"
        example: "Name"
      nickName:
        type: string <nullable>
        description: "**Employee's nickname**"
        example: "nickname"
      dob:
        type: string <nullable>
        format: datetime
        description: "**Employee's date of birth**"
        example: "2025-08-29T03:00:00Z"
      gender:
        type: string <nullable>
        description: "**Employee's gender**"
      identities:
        type: array
        items:
          $ref: ../../common_schemas/NaturalPersonIdentityEntity.yaml
        description: "**Employee's identities**"
      nationality:
        type: string <nullable>
        description: "**Employee's nationality**"
      maritalStatus:
        $ref: ../enums/MaritalStatus.yaml
      occupation:
        type: string <nullable>
        description: "**Employee's occupation**"
      role:
        $ref: ../enums/ParticipantRole.yaml
      status:
        $ref: ../enums/PersonStatus.yaml
      addresses:
        type: array
        items:
          $ref: AddressEntity.yaml
        description: "**Employee's addresses**"
      emails:
        type: array
        items:
          $ref: EmailEntity.yaml
        description: "**Employee's emails**"
      phoneNumbers:
        type: array
        items:
          $ref: PhoneNumberEntity.yaml
        description: "**Employee's phone numbers**"