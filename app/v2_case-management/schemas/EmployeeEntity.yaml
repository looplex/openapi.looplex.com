title: Funcionário
type: object
allOf:
  - $ref: ../../scim/Resource.yaml
  - type: object
    properties:
      Name:
        type: string
      NickName:
        type: string <nullable>
      Dob:
        type: string <nullable>
        format: datetime
      Gender:
        type: string <nullable>
      Identities:
        type: array
        items:
          $ref: ../../common_schemas/IdentityEntity.yaml
      Nationality:
        type: string <nullable>
      MaritalStatus:
        $ref: ../enums/MaritalStatus.yaml
      Occupation:
        type: string <nullable>
      Role:
        $ref: ../enums/ParticipantRole.yaml
      Addresses:
        type: array
        items:
          $ref: AddressEntity.yaml
      Emails:
        type: array
        items:
          $ref: EmailEntity.yaml
      PhoneNumbers:
        type: array
        items:
          $ref: PhoneNumberEntity.yaml