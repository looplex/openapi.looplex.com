tags:
  - Additional information value
summary: "/additionalInformationValues"
description: |
  **Create Additional information value**<br />
  Item created's guid is returned in **Location header**<br />
  Informe `AdditionalInformationId` e **exatamente um** entre `CaseId` e `EmployeeId`; só existe um valor por par dado complementar + processo/funcionário. O valor é validado pelo tipo e tamanho do dado complementar e, em tipos dropdown, precisa estar em `Values`
operationId: additionalInformationValues-post
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
requestBody:
  content:
    application/json:
      schema:
        $ref: ../../schemas/v2_case-management/AdditionalInformationValueEntityWrite.yaml
responses:
  "201":
    description: "Created"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../scim/SCIMError.yaml
