tags:
  - Client
summary: "/clients"
description: |
  **Create a client**<br />
  Item created's guid is returned in **Location header**
operationId: clients-post
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
requestBody:
  content:
    application/json:
      schema:
        $ref: ../../schemas/v2_case-management/ClientEntityWrite.yaml
responses:
  "201":
    description: "Created"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'
 