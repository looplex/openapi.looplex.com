tags:
  - Client
summary: "/clients/client_id"
description: |
  **Retrieve a client by id**
operationId: clients-client_id-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  # Utilizado em endpoint retrieve
  - name: client_id
    in: path
    required: true
    description: |
      **The item's unique identifier**
    schema:
      type: string
      format: uuid
responses:
  # Utilizado quando apenas um item for retornado
  "200":
      description: "OK"
      content:
        application/json:
          schema:
            $ref: ../schemas/ClientEntity.yaml
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'