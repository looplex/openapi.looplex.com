tags:
  - Client
summary: "/Clients/:id"
description: "**Patch Client**"
operationId: clients-patch
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - name: id
    in: path
    required: true
    description: "**The item's unique identifier**"
    schema:
      type: string
      format: uuid
requestBody:
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: ../../common_schemas/PatchEntity.yaml
responses:
  "204":
    description: "No Content"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'