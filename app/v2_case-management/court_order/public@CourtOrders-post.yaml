tags:
  - Court Order
summary: "/courtorders"
description: |
  **Create a court order**<br />
  Item created's guid is returned in **Location header**<br />
  `provider`, `content` and `publicationDate` are required. The court order is always created with the type PUBLICACAO.
operationId: api-v1-CourtOrders-post
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
requestBody:
  content:
    application/json:
      schema:
        $ref: ../../schemas/v2_case-management/CourtOrderEntityWrite.yaml
responses:
  "201":
    description: "Created"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'
