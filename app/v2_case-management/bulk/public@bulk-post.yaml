tags:
  - Bulk request
summary: "/bulk"
description: |
  **Endpoint to [insert] multiple resources at once**<br />
  `Ainda não disponível para utilização`
operationId: bulk-post
# query / path parameters
parameters:
  # quando o endpoint está dentro de uma pasta
  - $ref: ../../../app/parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../../app/parameters/common/Tenant.yaml
  - $ref: ../../../app/parameters/common/BearerToken.yaml
# request body
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          failOnErrors:
            type: integer
            description: "**Cancel next operations when this quantity of errors occurs**"
          Operations:
            type: array
            items:
              type: object
              properties:
                method:
                  type: string
                  example: <http_verb>
                  description: |
                    **Options available**<br/>
                    POST
                path:
                  type: string
                  example: <endpoint_route>
                  description: |
                    **The route**<br />
                    **e.g:**
                    `/Entries`, `/LegalCategories`, `/Timesheets`
                bulkId:
                  type: string
                  description: |
                    **unique identifier of this operation**<br/>
                    **e.g:** `resource-1`
                  example: "<identifier_that_must_be_unique_in_operations>"
                data:
                  example: {}
                  oneOf:
                    - $ref: ../../../app/schemas/v2_case-management/EntryEntityWrite.yaml
                    - $ref: ../../../app/schemas/v2_case-management/LegalCategoryEntityWrite.yaml
                    - $ref: ../../../app/schemas/v2_case-management/TimesheetEntityWrite.yaml
                  description: |
                    **The data to [insert]**
# http responses
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: object
          properties:
            Operations:
              type: array
              items:
                type: object
                properties:
                  location:
                    type: string
                    description: "**The location of the resource**<br/>(/Resources mean the type of Resource in the request. e.g: /Entries)"
                    example: "/Resources/<resource_uuid>"
                  method:
                    type: integer
                  path:
                    type: string
                    example: /Resources
                    description: "**The path of the operation**<br/>(/Resources mean the type of Resource in the request. e.g: /Entries)"
                  status:
                    type: integer
                    example: 201
                    description: "**The http status code for this operation**"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          # quando o endpoint está dentro de uma pasta
          $ref: ../../scim/SCIMError.yaml