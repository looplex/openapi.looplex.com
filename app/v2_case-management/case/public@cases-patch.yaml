tags:
  - Case Management
summary: "/Cases/:id"
description: "**Patch case properties**"
operationId: cases-patch-patch
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - $ref: ../../common_parameters/Id.yaml
requestBody:
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: ../../common_schemas/PatchEntity.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: boolean
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'