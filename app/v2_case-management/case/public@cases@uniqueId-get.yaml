# Linhas com # são comentários e podem ser removidas.
tags:
  - Case Management
summary: "/cases/:id"
description: |
  **Retrieve information about a case**
operationId: cases-case_id-get
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - $ref: ../../parameters/common/Id.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: ../../schemas/v2_case-management/CaseEntityRetrieve.yaml
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'