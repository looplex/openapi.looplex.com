# Linhas com # são comentários e podem ser removidas.
tags:
  - Case Management
summary: "/Cases/:id"
description: |
  **Retrieve information about a case**
operationId: cases-case_id-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - $ref: ../../common_parameters/Id.yaml
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          $ref: "../schemas/CaseEntity.yaml"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'