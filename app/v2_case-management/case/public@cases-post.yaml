tags:
  - Case Management
summary: "/Cases"
description: |
  **Create a new case**<br />
  Item created's guid is returned in **Location header**
operationId: cases-post
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
requestBody:
  content:
    application/json:
      schema:
        $ref: ../schemas/CaseEntityWrite.yaml
responses:
  "201":
    description: "Created"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'