# Linhas com # são comentários e podem ser removidas.
tags:
  - Case Management
summary: "/Cases"
description: |
  **Fetch cases paginated**
operationId: cases-get
# Parâmetros da requisição
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - $ref: ../../common_parameters/StartIndex.yaml
  - $ref: ../../common_parameters/Count.yaml
  - $ref: ../../common_parameters/Filter.yaml
  - $ref: ../../common_parameters/SortBy.yaml
  - $ref: ../../common_parameters/SortOrder.yaml
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../common_schemas/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: "../schemas/CaseInfoEntityQuery.yaml"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'