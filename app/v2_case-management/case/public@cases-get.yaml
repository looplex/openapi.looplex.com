# Linhas com # são comentários e podem ser removidas.
tags:
  - Case Management
summary: "/Cases"
description: |
  **Fetch cases paginated**
operationId: cases-get
# Parâmetros da requisição
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - $ref: ../../parameters/common/StartIndex.yaml
  - $ref: ../../parameters/common/Count.yaml
  - $ref: ../../parameters/common/Filter.yaml
  - $ref: ../../parameters/common/SortBy.yaml
  - $ref: ../../parameters/common/SortOrder.yaml
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../schemas/common/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../schemas/v2_case-management/CaseInfoEntityQuery.yaml
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'