tags:
  - Case Management
summary: "/cases"
description: "**Fetch cases paginated**"
operationId: cases-get
# query / path parameters
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../parameters/common/Tenant.yaml
  - $ref: ../../parameters/common/BearerToken.yaml
  - $ref: ../../parameters/scim/StartIndex.yaml
  - $ref: ../../parameters/scim/Count.yaml
  - $ref: ../../parameters/scim/Filter.yaml
  - $ref: ../../parameters/common/SortBy.yaml
  - $ref: ../../parameters/common/SortOrder.yaml
# http responses
responses:
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../schemas/common/ListResponse.yaml'
            - type: object
              properties:
                resources:
                  type: array
                  items:
                    $ref: ../../schemas/v2_case-management/CaseInfoEntityQuery.yaml
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: ../../scim/SCIMError.yaml