# Linhas com # são comentários e podem ser removidas.
tags:
  - Authentication
summary: "/token"
description: |
  **Authentication endpoint**
operationId: token-post
# Parâmetros da requisição
parameters:
  - $ref: ../../parameters/common/OcpApimSubscriptionKey.yaml
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          grant_type:
            type: string
            required: true
            example: 'urn:ietf:params:oauth:grant-type:token-exchange'
            description: |
              **The grant type**<br/>
              _e.g. urn:ietf:params:oauth:grant-type:token-exchange_
          subject_token:
            type: string
            required: true
            example: '{{access_token}}'
            description: '**The access token returned by the identity provider**'
          subject_token_type:
            type: string
            required: true
            example: 'urn:ietf:params:oauth:token-type:access_token'
            description: |
              **The token type**<br/>
              _e.g. urn:ietf:params:oauth:token-type:access_token_
        required:
          - grant_type
          - subject_token
          - subject_token_type
      # example: 
      #   grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange'
      #   subject_token: '{{access_token}}'
      #   subject_token_type: 'urn:ietf:params:oauth:token-type:access_token'
# Responses
responses:
  # Adicione aqui outras respostas HTTP. Verificar menu "Copiar nova resposta HTTP"
  "200":
    description: "OK"
    content:
      application/json:
        schema:
          type: object
          properties:
            access_token:
              type: string
              description: '**The token to use in all other requests**'
              example: 'access_token_example'
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'
