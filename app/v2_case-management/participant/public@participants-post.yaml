tags:
  - Participant
summary: "/Participants"
description: |
  **Create participant**<br />
  Item created's guid is returned in **Location header**
operationId: participants-post
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
requestBody:
  content:
    application/json:
      schema:
        oneOf:
          - $ref: ../../schemas/v2_case-management/ParticipantNaturalPersonWrite.yaml
          - $ref: ../../schemas/v2_case-management/ParticipantLegalPersonWrite.yaml
responses:
  "201":
    description: "Created"
  "400":
    description: "Bad Request"
  "401":
    description: "Unauthorized"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          $ref: '../../scim/SCIMError.yaml'