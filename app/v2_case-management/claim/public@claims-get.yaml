tags:
  - Claim
summary: "/claims"
description: "**Fetch items paginated**"
operationId: claims-get
parameters:
  - $ref: ../../parameters/OcpApimSubscriptionKey.yaml
  - $ref: ../../common_parameters/Tenant.yaml
  - $ref: ../../common_parameters/BearerToken.yaml
  - $ref: ../../common_parameters/Profile.yaml
  - name: startIndex
    in: query
    required: true
    description: |
      **Index of search**<br />
    example: 1
    schema:
      type: integer
  - name: count
    in: query
    required: true
    description: |
      **Total count of items to return**<br />
      `Max of 120`
    example: 50
    schema:
      type: integer
  - name: filter
    in: query
    required: true
    description: |
      **SCIM filter to search**<br />
      **e.g:** _CaseId_ _eq_ "_\<case-unique-identifier\>_"
    schema:
      type: string
responses:
  "200":
      description: "OK"
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../common_schemas/ListResponse.yaml'
              - type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: ../schemas/CaseClaimEntity.yaml
  "500":
      description: "Internal Server Error"