tags:
  - Claim
summary: "/claims/:id"
description: "**Delete a claim**"
operationId: claims-delete-id
# query / path parameters
parameters:
  # quando o endpoint está dentro de uma pasta
  - $ref: ../../../app/parameters/common/OcpApimSubscriptionKey.yaml
  - $ref: ../../../app/parameters/common/Tenant.yaml
  - $ref: ../../../app/parameters/common/BearerToken.yaml
  # demais parametros
  - name: id
    in: path
    required: true
    description: "**The item's unique identifier**"
    schema:
      type: string
      format: uuid
# http responses
responses:
  "204":
    description: "No Content"
  "404":
    description: "Not Found"
  "500":
    description: "Internal Server Error"
    content:
      application/json:
        schema:
          # quando o endpoint está dentro de uma pasta
          $ref: ../../scim/SCIMError.yaml